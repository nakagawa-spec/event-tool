<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>店舗イベント管理</title>
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7;--panel:#fff;--line:#e1e4e8;--line2:#eef0f2;--text:#1f2933;--muted:#69737f;
  --accent:#1f6feb;--accent-weak:#e8f0fe;--danger:#c5221f;--danger-weak:#fce8e6;
  --ok:#137333;--ok-weak:#e6f4ea;--warn:#a05a00;--warn-weak:#fef3e0;
  --sat:#e8f0fe;--sun:#fce8e6;--sat-text:#1a56c4;--sun-text:#c5221f;
  --visit:#3b7be8;--exhibit:#e07b12;--big:#8b3fd9;--allc:#16803c;
  --dw:34px;--namew:132px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px}
button:hover{background:#f6f8fa}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#185fcc}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
button.link.danger-text{color:var(--danger)}
button.small{padding:2px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid #cfd4da;border-radius:6px;padding:5px 8px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=number]{text-align:right}
h1,h2,h3{margin:0}
h2{font-size:17px}
h3{font-size:15px;margin-bottom:8px}
.muted{color:var(--muted)}
.small-text{font-size:12px}
.grow{flex:1}
.nowrap{white-space:nowrap}
.right{text-align:right}
.red{color:var(--danger);font-weight:600}

/* ヘッダー */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:6px 12px;border-radius:6px;color:var(--muted)}
.tabs button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user{display:flex;align-items:center;gap:6px}
.role{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--line2);color:var(--muted)}
.role.admin{background:#f3e8fd;color:#7b2fbf}
#sync-info{font-size:12px;color:var(--muted)}
#sync-info.err{color:var(--danger)}
.banner{padding:8px 16px;font-size:13px}
.banner.demo{background:var(--warn-weak);color:var(--warn)}
.banner.warn{background:var(--danger-weak);color:var(--danger);border-radius:8px;margin-bottom:12px}

/* レイアウト */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;align-items:start}
.layout.todo-closed{grid-template-columns:minmax(0,1fr) auto}
main{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.view-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:none;border-radius:0;padding:5px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav strong{min-width:90px;text-align:center}

/* 絞り込み */
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;align-items:center}
.fgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fchip{font-size:12px;padding:2px 9px;border-radius:12px}
.fchip.on{background:var(--accent-weak);border-color:#b7cdf7;color:var(--accent)}
.fchip.blk{font-weight:600}

/* 店舗別 */
.sg-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.sg{display:inline-block;min-width:100%}
.sg-row{display:flex;border-bottom:1px solid var(--line2)}
.sg-row:last-child{border-bottom:none}
.sg-name{position:sticky;left:0;z-index:3;flex:0 0 var(--namew);width:var(--namew);background:#fff;padding:4px 8px;border-right:1px solid var(--line);font-size:13px;display:flex;align-items:center}
.sg-head .sg-name{font-weight:600;color:var(--muted)}
.sg-days{display:grid;grid-template-columns:repeat(var(--n),var(--dw))}
.sg-day{text-align:center;font-size:12px;padding:3px 0;line-height:1.2;border-left:1px solid var(--line2)}
.sg-day small{display:block;color:var(--muted);font-size:10px}
.sg-day.sat{background:var(--sat);color:var(--sat-text)}
.sg-day.sun,.sg-day.hol{background:var(--sun);color:var(--sun-text)}
.sg-day.today{box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
.sg-block .sg-name{background:#f7f8fa;font-weight:700;font-size:12px;color:var(--muted)}
.sg-block{background:#f7f8fa}
.sg-track{display:grid;grid-template-columns:repeat(var(--n),var(--dw));grid-template-rows:repeat(var(--lanes),24px);row-gap:3px;padding:4px 0;cursor:copy;position:relative}
.sg-bg{border-left:1px solid var(--line2)}
.sg-bg.sat{background:#f5f8fe}
.sg-bg.sun,.sg-bg.hol{background:#fdf4f3}
.row-big .sg-name{color:var(--big);font-weight:700}
.row-all .sg-name{color:var(--allc);font-weight:700}
.bar{position:relative;z-index:1;margin:0 2px;border-radius:5px;padding:0 6px;font-size:12px;line-height:24px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bar:hover,.chip:hover{filter:brightness(.92)}
.t-visit{background:var(--visit)}
.t-exhibit{background:var(--exhibit)}
.t-big{background:var(--big)}
.t-all{background:var(--allc)}

/* 月カレンダー */
.mc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mc-wd{padding:6px;text-align:center;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);background:#f7f8fa}
.mc-wd.sun{color:var(--sun-text)}.mc-wd.sat{color:var(--sat-text)}
.mc-cell{min-height:96px;padding:4px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);cursor:copy;min-width:0}
.mc-cell:nth-child(7n){border-right:none}
.mc-cell.sat{background:#f8faff}
.mc-cell.sun,.mc-cell.hol{background:#fff8f7}
.mc-cell.out{opacity:.45}
.mc-date{font-size:12px;margin-bottom:3px;display:flex;gap:4px;align-items:baseline}
.mc-cell.sat .mc-date{color:var(--sat-text)}
.mc-cell.sun .mc-date,.mc-cell.hol .mc-date{color:var(--sun-text)}
.mc-cell.today .mc-date b{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px}
.mc-hol{font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{font-size:11px;color:#fff;border-radius:4px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

/* 表 */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f7f8fa;white-space:nowrap}
tr.over td{background:var(--danger-weak)}
tr.total td{font-weight:700;background:#f7f8fa}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f6f8fb}
td.num,th.num{text-align:right;white-space:nowrap}
td input[type=number]{width:110px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.gray{background:var(--line2);color:var(--muted)}
.badge.red{background:var(--danger-weak);color:var(--danger)}
.typetag{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* カード */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.card .lbl{font-size:12px;color:var(--muted)}
.card .val{font-size:20px;font-weight:700;margin-top:2px}
.card .val.neg{color:var(--danger)}
.card input{width:100%;font-size:17px;font-weight:700;margin-top:2px}

/* ToDo */
.todo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.todo-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.todo-head h3{margin:0}
.todo-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.todo-item:last-child{border-bottom:none}
.todo-item input{margin-top:4px}
.todo-item .t1{font-size:13px;font-weight:600}
.todo-item .t2{font-size:12px;color:var(--muted)}
.todo-item.done .t1{text-decoration:line-through;color:var(--muted)}
.due{font-size:11px;padding:0 6px;border-radius:9px;background:var(--line2);color:var(--muted);white-space:nowrap}
.due.over{background:var(--danger-weak);color:var(--danger);font-weight:600}
.due.soon{background:var(--warn-weak);color:var(--warn)}
.todo.closed{padding:6px}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,33,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:620px;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:820px}
.modal h2{margin-bottom:12px}
.modal label,.field{display:block;margin-bottom:11px}
.modal label>span,.field>.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.modal label input:not([type=checkbox]):not([type=radio]),.modal label select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.chk{display:inline-flex !important;align-items:center;gap:5px;margin:0 10px 4px 0 !important;font-size:13px}
.blk{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;margin-top:6px}
.blk-head{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.alloc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.alloc-head,.alloc-auto{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.alloc-auto input{width:140px}
.alloc table td,.alloc table th{padding:4px 8px}
.err{color:var(--danger);font-size:13px;margin-top:6px;min-height:1em}
.temp-pass{font-size:22px;font-weight:700;letter-spacing:2px;background:#f7f8fa;border:1px dashed var(--line);padding:10px;text-align:center;border-radius:8px;margin:10px 0;user-select:all}

/* ログイン */
.auth{max-width:420px;margin:60px auto;padding:0 16px}
.auth .panel{padding:24px}
.auth h1{font-size:20px;margin-bottom:4px}
.auth label{display:block;margin-bottom:12px}
.auth label span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.auth input,.auth select{width:100%}
.auth button.primary{width:100%;padding:9px;margin-top:6px}
.note{font-size:12px;color:var(--muted);background:#f7f8fa;border-radius:6px;padding:8px 10px;margin-bottom:12px}

/* 通知 */
#toast-root{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#202124;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
.toast button{background:none;border:none;color:#8ab4f8;padding:0;font-weight:600}

.memo{border-bottom:1px solid var(--line2);padding:8px 0;display:flex;gap:10px}
.memo:last-child{border-bottom:none}
.memo .d{font-size:12px;color:var(--muted);white-space:nowrap;min-width:84px}
.memo .txt{white-space:pre-wrap;flex:1}
.memo-form{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.memo-form textarea{flex:1;min-height:38px;min-width:200px}
.exp td{padding:4px 6px}
.exp input,.exp select{width:100%}
.exp-box{background:#f9fafb;padding:10px 12px}

/* 実績入力 */
.store-pick{display:flex;align-items:center;gap:8px;font-weight:600}
.store-pick select{font-size:15px;padding:6px 10px;min-width:180px;font-weight:600}
button.big{font-size:15px;padding:8px 18px;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--accent-weak);color:#24426e;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.target-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.target-seg button{text-align:left;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:#fff}
.target-seg button b{display:block;font-size:14px}
.target-seg button small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.target-seg button.on{border-color:var(--accent);background:var(--accent-weak)}
.target-seg button.on b{color:var(--accent)}
.card .small-text{margin-top:2px}
.num-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;margin-right:8px;vertical-align:1px}
.todo-panel{border-color:#f2c779;background:#fffaf0}
.todo-panel table{background:transparent}
.rs-ev{background:#f7f8fa;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.rs-num small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.rs-in{display:flex;align-items:center;gap:6px}
.modal .rs-in input{font-size:20px;font-weight:700;padding:6px 10px}
.rs-in em{font-style:normal;color:var(--muted)}

@media (max-width:900px){
  .layout,.layout.todo-closed{grid-template-columns:minmax(0,1fr);padding:12px}
  aside{order:-1}
  .todo{position:static;max-height:260px}
  :root{--namew:96px}
  .grid2{grid-template-columns:1fr}
  .target-seg{grid-template-columns:1fr}
  .mc-cell{min-height:70px}
}
@media print{.top,aside,.banner.demo{display:none}.layout{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
// ====================================================================== 設定
const CFG = window.EVENT_TOOL_CONFIG || {};
const API_URL = String(CFG.apiUrl || '').trim();
const DEMO = !API_URL;
const POLL_MS = 60000;

const VISIT_TYPES = ['完成見学会', 'モデルハウス見学会', '移動型見学会', '相談会', '賑やかし', 'キャンペーン', 'その他'];
const EXHIBIT_TYPES = ['大型出展イベント', '出展イベント'];
const BIG = '大型出展イベント';
const ROLE_LABEL = { admin: '管理者', manager: '店長', staff: 'スタッフ' };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const TABS = [['calendar', 'カレンダー'], ['actual', '実績入力'], ['plan', '四半期計画'], ['effect', '効果検証'], ['budget', '予算管理']];

const DEFAULT_STORES = {
  blocks: [
    { id: 'blk_okayama', name: '岡山BLK' }, { id: 'blk_kurashiki', name: '倉敷BLK' },
    { id: 'blk_hiroshima', name: '広島BLK' }, { id: 'blk_kagawa', name: '香川BLK' }
  ],
  stores: [
    { id: 'st_okayama', name: '岡山店', blockId: 'blk_okayama', scale: 1 },
    { id: 'st_higashi', name: '東店', blockId: 'blk_okayama', scale: 1 },
    { id: 'st_barazono', name: 'バラ園', blockId: 'blk_okayama', scale: 1 },
    { id: 'st_barazono2', name: 'バラ園２', blockId: 'blk_okayama', scale: 1 },
    { id: 'st_takumito', name: 'TAKUMITO', blockId: 'blk_okayama', scale: 1 },
    { id: 'st_kurashiki', name: '倉敷店', blockId: 'blk_kurashiki', scale: 1 },
    { id: 'st_souten', name: '總展', blockId: 'blk_kurashiki', scale: 1 },
    { id: 'st_soja', name: '総社店', blockId: 'blk_kurashiki', scale: 1 },
    { id: 'st_fukuyama', name: '福山店', blockId: 'blk_hiroshima', scale: 1 },
    { id: 'st_fukuyamaminami', name: '福山南展', blockId: 'blk_hiroshima', scale: 1 },
    { id: 'st_takamatsu', name: '高松展', blockId: 'blk_kagawa', scale: 1 }
  ]
};
const DEFAULT_COST_ITEMS = {
  items: [
    { id: 'ci_flyer', name: 'チラシ・ポスティング' }, { id: 'ci_paper', name: '新聞折込' },
    { id: 'ci_web', name: 'Web広告' }, { id: 'ci_sns', name: 'SNS広告' },
    { id: 'ci_venue', name: '会場費・出展料' }, { id: 'ci_gift', name: 'ノベルティ・景品' },
    { id: 'ci_deco', name: '装飾・備品' }, { id: 'ci_food', name: '飲食' }, { id: 'ci_other', name: 'その他' }
  ]
};
const TODO_DEFS = [
  { key: 'ad', label: '広告・イベントページ作成', due: e => addDays(e.start, -21) },
  { key: 'hp', label: 'HP UP・広告開始', due: e => addDays(e.start, -14) },
  { key: 'result', label: '来場実績・成果を入力', due: e => addDays(evEnd(e), 1) }
];

// ====================================================================== 小さな道具
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = Number(String(v == null ? '' : v).replace(/[,¥\s円]/g, '')); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const pct = (a, b) => b > 0 ? (a / b * 100).toFixed(1) + '%' : '—';
const per = (a, b) => b > 0 ? yen(a / b) : '—';
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function lsJSON(k, def) { try { const v = JSON.parse(lsGet(k)); return v == null ? def : v; } catch (e) { return def; } }

// 日付は 'YYYY-MM-DD' の文字列で扱う
function toDS(d) { return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function fromDS(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function addDays(s, n) { const d = fromDS(s); d.setUTCDate(d.getUTCDate() + n); return toDS(d); }
function diffDays(a, b) { return Math.round((fromDS(b) - fromDS(a)) / 86400000); }
function dow(s) { return fromDS(s).getUTCDay(); }
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function md(s) { if (!s) return ''; const [, m, d] = s.split('-').map(Number); return `${m}/${d}(${WD[dow(s)]})`; }

// 祝日(2020年以降の法律にもとづいて計算)
const holCache = {};
function nthMonday(y, m, n) { const w = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); return 1 + (8 - w) % 7 + 7 * (n - 1); }
function holidaysFor(y) {
  if (holCache[y]) return holCache[y];
  const h = {};
  const add = (m, d, n) => { h[`${y}-${pad(m)}-${pad(d)}`] = n; };
  const k = y - 1980;
  add(1, 1, '元日'); add(1, nthMonday(y, 1, 2), '成人の日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日');
  add(3, Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4)), '春分の日');
  add(4, 29, '昭和の日'); add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  add(7, nthMonday(y, 7, 3), '海の日'); add(8, 11, '山の日'); add(9, nthMonday(y, 9, 3), '敬老の日');
  add(9, Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4)), '秋分の日');
  add(10, nthMonday(y, 10, 2), 'スポーツの日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  const base = Object.keys(h).sort();
  base.forEach(d => { // 国民の休日(祝日にはさまれた平日)
    const mid = addDays(d, 1), next = addDays(d, 2);
    if (h[next] && !h[mid] && dow(mid) !== 0) h[mid] = '国民の休日';
  });
  base.forEach(d => { // 振替休日
    if (dow(d) !== 0) return;
    let n = addDays(d, 1);
    while (h[n]) n = addDays(n, 1);
    h[n] = '振替休日';
  });
  return (holCache[y] = h);
}
function holidayName(s) { return holidaysFor(Number(s.slice(0, 4)))[s] || ''; }
function dayClass(s) { const w = dow(s); return holidayName(s) ? 'hol' : w === 0 ? 'sun' : w === 6 ? 'sat' : ''; }

const session = { token: lsGet('evt-token'), user: null };

async function api(action, params) {
  const body = Object.assign({ action, token: session.token }, params || {});
  let res;
  try {
    if (DEMO) res = await demoApi(body);
    else {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
      res = await r.json();
    }
  } catch (e) {
    throw new Error('サーバーにつながりませんでした。ネットワークを確認してください');
  }
  if (!res || !res.ok) {
    const err = new Error((res && res.error) || 'エラーが起きました');
    err.code = res && res.code;
    if (err.code === 'AUTH') setTimeout(() => forceLogout(err.message), 0);
    if (err.code === 'MUST_CHANGE') setTimeout(() => showAuth('change'), 0);
    throw err;
  }
  return res;
}

// ---------------------------------------------------------------- お試しモード(ブラウザ内だけで動く代わりのサーバー)
async function sha(s) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return btoa(String.fromCharCode.apply(null, new Uint8Array(b)));
  }
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h);
}
async function demoApi(req) {
  await new Promise(r => setTimeout(r, 120));
  const db = lsJSON('evt-demo-db', null) || { users: [], sessions: [], data: {}, ver: 0 };
  const save = () => lsSet('evt-demo-db', JSON.stringify(db));
  const ng = (error, code) => ({ ok: false, error, code });
  const pub = u => ({ id: u.id, email: u.email, name: u.name, role: u.role, requestedRole: u.requestedRole || '', mustChange: !!u.mustChange, createdAt: u.createdAt, lastLogin: u.lastLogin });
  const hash = (p, salt) => sha(salt + ':' + p);
  const newSession = uidv => { const t = uid() + uid(); db.sessions.push({ token: t, userId: uidv }); return t; };
  const listUsers = () => ({ ok: true, users: db.users.map(pub) });
  const email = String(req.email || '').trim().toLowerCase();
  const now = new Date().toISOString();
  switch (req.action) {
    case 'status': return { ok: true, hasUsers: db.users.length > 0 };
    case 'register': {
      const name = String(req.name || '').trim();
      if (!name) return ng('名前を入力してください');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ng('メールアドレスの形式が正しくありません');
      if (String(req.password || '').length < 8) return ng('パスワードは8文字以上にしてください');
      if (db.users.some(u => u.email === email)) return ng('このメールアドレスはすでに登録されています');
      const first = db.users.length === 0;
      let role = req.role, requestedRole = '';
      if (role === 'admin' && !first) { role = 'manager'; requestedRole = 'admin'; }
      if (first) role = 'admin';
      const salt = uid();
      const u = { id: uid(), email, name, role, requestedRole, salt, hash: await hash(req.password, salt), mustChange: false, createdAt: now, lastLogin: now };
      db.users.push(u);
      const token = newSession(u.id); save();
      return { ok: true, token, user: pub(u) };
    }
    case 'login': {
      const u = db.users.find(x => x.email === email);
      if (!u || await hash(String(req.password || ''), u.salt) !== u.hash) return ng('メールアドレスまたはパスワードが違います');
      u.lastLogin = now; const token = newSession(u.id); save();
      const docs = {}; Object.entries(db.data).forEach(([k, r]) => { if (!r.deleted) docs[k] = r.value; });
      return { ok: true, token, user: pub(u), docs, version: db.ver };
    }
  }
  const s = db.sessions.find(x => x.token === req.token);
  const me = s && db.users.find(u => u.id === s.userId);
  if (!me) return ng('ログインの有効期限が切れました。もう一度ログインしてください', 'AUTH');
  if (me.mustChange && !['changePassword', 'me', 'logout'].includes(req.action)) return ng('仮パスワードを変更してください', 'MUST_CHANGE');
  const adminOnly = ['listUsers', 'approveAdmin', 'rejectAdmin', 'setRole', 'resetPassword', 'deleteUser'];
  if (adminOnly.includes(req.action) && me.role !== 'admin') return ng('管理者だけが使える操作です');
  const target = db.users.find(u => u.id === req.userId);
  const admins = db.users.filter(u => u.role === 'admin').length;
  switch (req.action) {
    case 'me': return { ok: true, user: pub(me) };
    case 'logout': db.sessions = db.sessions.filter(x => x.token !== req.token); save(); return { ok: true };
    case 'changePassword': {
      if (await hash(String(req.current || ''), me.salt) !== me.hash) return ng('今のパスワードが違います');
      if (String(req.password || '').length < 8) return ng('新しいパスワードは8文字以上にしてください');
      me.salt = uid(); me.hash = await hash(req.password, me.salt); me.mustChange = false; save();
      return { ok: true, user: pub(me) };
    }
    case 'load': case 'changes': {
      const since = req.action === 'load' ? 0 : Number(req.since) || 0;
      const docs = {};
      Object.entries(db.data).forEach(([k, r]) => {
        if (r.updatedAt <= since) return;
        if (req.action === 'load' && r.deleted) return;
        docs[k] = r.deleted ? null : r.value;
      });
      return { ok: true, docs, version: db.ver, user: pub(me) };
    }
    case 'put': db.ver++; db.data[req.key] = { value: req.value, updatedAt: db.ver, deleted: false }; save(); return { ok: true, version: db.ver };
    case 'remove': db.ver++; db.data[req.key] = { value: null, updatedAt: db.ver, deleted: true }; save(); return { ok: true, version: db.ver };
    case 'listUsers': return listUsers();
    case 'approveAdmin': if (target) { target.role = 'admin'; target.requestedRole = ''; } save(); return listUsers();
    case 'rejectAdmin': if (target) target.requestedRole = ''; save(); return listUsers();
    case 'setRole':
      if (!target) return ng('アカウントが見つかりません');
      if (target.role === 'admin' && req.role !== 'admin' && admins <= 1) return ng('最後の1人の管理者の権限は変更できません');
      target.role = req.role; target.requestedRole = ''; save(); return listUsers();
    case 'resetPassword': {
      if (!target) return ng('アカウントが見つかりません');
      const temp = Math.random().toString(36).slice(2, 7) + Math.random().toString(36).slice(2, 7);
      target.salt = uid(); target.hash = await hash(temp, target.salt); target.mustChange = true;
      db.sessions = db.sessions.filter(x => x.userId !== target.id); save();
      return { ok: true, tempPassword: temp };
    }
    case 'deleteUser':
      if (req.userId === me.id) return ng('自分のアカウントは削除できません');
      if (!target) return ng('アカウントが見つかりません');
      if (target.role === 'admin' && admins <= 1) return ng('最後の1人の管理者は削除できません');
      db.users = db.users.filter(u => u.id !== target.id);
      db.sessions = db.sessions.filter(x => x.userId !== target.id); save();
      return listUsers();
  }
  return ng('不明な操作です: ' + req.action);
}

// ====================================================================== データ
let docs = {};          // "collection/id" → 値
let version = 0;        // ここまでの変更を受け取った印
let lastSync = null;
let syncState = '';     // '' | saving | error
let pendingWrites = 0;
const writingKeys = new Set();

function getDoc(k) { return docs[k] || null; }
function storesCfg() { const d = getDoc('config/stores'); return d && Array.isArray(d.stores) ? d : DEFAULT_STORES; }
function blocks() { return storesCfg().blocks || []; }
function stores() { return storesCfg().stores || []; }
function storesOrdered() {
  const bl = blocks().map(b => b.id);
  const out = [];
  bl.forEach(b => stores().filter(s => s.blockId === b).forEach(s => out.push(s)));
  stores().filter(s => !bl.includes(s.blockId)).forEach(s => out.push(s));
  return out;
}
function storeById(id) { return stores().find(s => s.id === id); }
function storeName(id) { if (id === 'all') return '全店共通'; const s = storeById(id); return s ? s.name : '(削除された店舗)'; }
function costItems() { const d = getDoc('config/costItems'); return d && Array.isArray(d.items) ? d.items : DEFAULT_COST_ITEMS.items; }
function costName(id) { const c = costItems().find(x => x.id === id); return c ? c.name : '(削除された項目)'; }

function evList() {
  return Object.keys(docs).filter(k => k.startsWith('events/') && docs[k]).map(k => docs[k])
    .sort((a, b) => (a.start || '').localeCompare(b.start || '') || (a.name || '').localeCompare(b.name || ''));
}
function getEvent(id) { return getDoc('events/' + id); }
function evEnd(e) { return e.end && e.end >= e.start ? e.end : e.start; }
function isAll(e) { return (e.stores || []).includes('all'); }
function isSingle(e) { return !isAll(e) && (e.stores || []).length === 1; }
function participants(e) { return isAll(e) ? stores().map(s => s.id) : (e.stores || []).slice(); }
function category(e) { return EXHIBIT_TYPES.includes(e.type) ? 'exhibit' : 'visit'; }
function typeClass(e) { return e.type === BIG ? 't-big' : category(e) === 'exhibit' ? 't-exhibit' : isAll(e) ? 't-all' : 't-visit'; }
function storeLabel(e) {
  if (isAll(e)) return '全店共通';
  const n = (e.stores || []).map(storeName);
  return n.length > 2 ? `${n[0]}・${n[1]} 他${n.length - 2}店` : n.join('・');
}
function allocTotal(e) { return sum(e.allocations || [], a => sum(Object.values(a.amounts || {}), num)); }
function budgetOf(e) { return isSingle(e) ? num(e.budget) : allocTotal(e); }
function shareOf(e, sid) {
  if (isSingle(e)) return e.stores[0] === sid ? num(e.budget) : 0;
  return sum(e.allocations || [], a => num((a.amounts || {})[sid]));
}
function usedOf(e) { return sum(e.expenses || [], x => num(x.amount)); }
/** 店舗ごとの使用金額。合同イベントは割り振った予算の比率で按分する */
function usedShare(e, sid) {
  const u = usedOf(e);
  if (isSingle(e)) return e.stores[0] === sid ? u : 0;
  const p = participants(e);
  if (!p.includes(sid)) return 0;
  const tot = budgetOf(e);
  return tot > 0 ? u * shareOf(e, sid) / tot : u / p.length;
}
function ratio(e, sid) { const u = usedOf(e); return sid === 'all' ? 1 : u > 0 ? usedShare(e, sid) / u : (participants(e).includes(sid) ? 1 / participants(e).length : 0); }
function todoDone(e, key) {
  if (key === 'result' && e.result && e.result.entered) return true;
  return !!(e.todos && e.todos[key]);
}
function hasResult(e) { return !!(e.result && e.result.entered); }

// イベントに紐付かない費用(costs/{id})
function costList() { return Object.keys(docs).filter(k => k.startsWith('costs/') && docs[k]).map(k => docs[k]); }
function othersIn(range, sid) {
  return costList().filter(c => c.date && c.date >= range[0] && c.date <= range[1] && (sid === 'all' || c.storeId === sid))
    .sort((a, b) => a.date.localeCompare(b.date));
}
/** 店舗・期間の費用明細(イベントの費用+イベント以外の費用)。費用の日付で絞り込む。amt は店舗分(按分後) */
function costRows(range, sid) {
  const rows = [];
  evList().forEach(e => {
    if (sid !== 'all' && !participants(e).includes(sid)) return;
    const r = ratio(e, sid);
    (e.expenses || []).forEach(x => {
      const d = e.start; // イベントの費用は開催月に入れる
      if (d && d >= range[0] && d <= range[1]) rows.push({ kind: 'event', e, x, date: d, full: num(x.amount), amt: num(x.amount) * r, by: x.by || '' });
    });
  });
  othersIn(range, sid).forEach(c => rows.push({ kind: 'other', x: c, date: c.date, full: num(c.amount), amt: num(c.amount), by: c.updatedBy || c.createdBy || '' }));
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------------------------------------------------------------- 読み込み・保存
async function loadAll() {
  const r = await api('load');
  applyLoaded(r);
}
function applyLoaded(r) {
  const next = r.docs || {};
  writingKeys.forEach(k => { if (k in docs) next[k] = docs[k]; else delete next[k]; }); // 保存中のものは手元を優先
  docs = next;
  version = r.version || 0;
  if (r.user) session.user = r.user;
  lastSync = new Date();
  cacheSave();
}

// ---------------------------------------------------------------- 前回の内容をブラウザに覚えておき、次に開いたときすぐ表示する
const CACHE_KEY = 'evt-cache';
let cacheTimer = null, refreshing = false;
function cacheSave() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    if (session.user && session.token) lsSet(CACHE_KEY, JSON.stringify({ token: session.token, user: session.user, docs, version }));
  }, 500);
}
function cacheLoad() {
  const c = lsJSON(CACHE_KEY, null);
  return c && c.docs && c.user && c.token === session.token ? c : null;
}
/** 覚えていた内容で表示したあと、裏で最新の内容を読み込む */
async function refreshInBackground() {
  refreshing = true; polling = true; renderSyncInfo();
  const before = JSON.stringify(session.user);
  try {
    await loadAll();
    if (!session.user) return;
    if (JSON.stringify(session.user) !== before) { $('root').innerHTML = shellHtml(); render(); }
    else softRender();
  } catch (e) {
    if (e.code !== 'AUTH' && e.code !== 'MUST_CHANGE') toast('最新の内容を読み込めませんでした:' + e.message, { err: true });
  } finally {
    refreshing = false; polling = false; renderSyncInfo();
  }
}

async function saveDoc(key, value, msg) {
  docs[key] = value;
  scheduleRender();
  await write(key, () => api('put', { key, value }), msg);
}
async function removeDoc(key, msg) {
  delete docs[key];
  scheduleRender();
  await write(key, () => api('remove', { key }), msg);
}
async function write(key, fn, msg) {
  pendingWrites++; writingKeys.add(key); syncState = 'saving'; renderSyncInfo();
  try {
    await fn();
    if (msg) toast(msg);
    cacheSave();
    syncState = '';
  } catch (e) {
    syncState = 'error';
    toast('保存できませんでした:' + e.message, { err: true });
    resync();
  } finally {
    pendingWrites--; writingKeys.delete(key);
    renderSyncInfo();
  }
}

/** 保存に失敗したときは、サーバーの内容を読み直して画面と食い違わないようにする */
async function resync() {
  try { await loadAll(); render(); } catch (e) { }
}

let polling = false;
async function poll(manual) {
  if (!session.user || polling) return;
  polling = true;
  try {
    const r = await api('changes', { since: version });
    let changed = false;
    Object.keys(r.docs || {}).forEach(k => {
      if (writingKeys.has(k)) return; // 自分が保存中のものは上書きしない
      const v = r.docs[k];
      if (JSON.stringify(docs[k] == null ? null : docs[k]) === JSON.stringify(v)) return;
      changed = true;
      if (v === null) delete docs[k]; else docs[k] = v;
    });
    version = Math.max(version, r.version || 0);
    if (r.user) session.user = r.user;
    lastSync = new Date();
    cacheSave();
    if (state.tab === 'accounts' && manual) loadUsers();
    if (changed) softRender(); else renderSyncInfo();
    if (manual) toast(changed ? '最新の内容に更新しました' : '最新の状態です');
  } catch (e) {
    if (manual) toast(e.message, { err: true });
  } finally {
    polling = false;
  }
}
setInterval(() => { if (document.visibilityState === 'visible') poll(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

// ====================================================================== 描画
let pointerDown = false, renderAfterPointer = false, pendingRender = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
document.addEventListener('pointerup', () => {
  pointerDown = false;
  if (renderAfterPointer) { renderAfterPointer = false; setTimeout(render, 0); }
}, true);
function scheduleRender() {
  if (pointerDown) renderAfterPointer = true;
  else setTimeout(render, 0);
}
/** 他の人の変更が届いたとき。入力中なら終わってから描き直す */
function softRender() {
  const ae = document.activeElement;
  const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (modalStack.length || typing) { pendingRender = true; renderSyncInfo(); return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => {
  const ae = document.activeElement;
  const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (pendingRender && !typing && !modalStack.length) render();
}, 50));

function render() {
  if (!session.user || !$('main')) return;
  pendingRender = false;
  const ae = document.activeElement;
  const fid = ae && ae.id && $('root').contains(ae) ? ae.id : null;
  let sel = null;
  try { if (fid && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { }
  const sx = $('sg-scroll') ? $('sg-scroll').scrollLeft : null;

  $('tabs').innerHTML = tabsHtml();
  $('main').innerHTML = mainHtml();
  $('todo').innerHTML = todoHtml();
  $('layout').classList.toggle('todo-closed', !!state.todoClosed);
  renderSyncInfo();

  if (sx != null && $('sg-scroll')) $('sg-scroll').scrollLeft = sx;
  if (fid && $(fid)) {
    const el = $(fid); el.focus();
    try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) { }
  }
}
function renderSyncInfo() {
  const el = $('sync-info'); if (!el) return;
  el.classList.toggle('err', syncState === 'error');
  if (syncState === 'saving' || pendingWrites) el.textContent = '保存中…';
  else if (syncState === 'error') el.textContent = '保存できなかった変更があります';
  else if (refreshing) el.textContent = '最新の内容を確認中…';
  else el.textContent = lastSync ? `最終更新 ${pad(lastSync.getHours())}:${pad(lastSync.getMinutes())}` + (pendingRender ? '(新しい変更あり)' : '') : '';
}

function filterHtml() {
  const groups = blocks().map(b => {
    const ss = stores().filter(s => s.blockId === b.id);
    if (!ss.length) return '';
    const allOn = ss.every(s => !isHidden(s.id));
    return `<div class="fgroup">
      <button class="fchip blk ${allOn ? 'on' : ''}" data-act="filter-block" data-v="${b.id}">${esc(b.name)}</button>
      ${ss.map(s => `<button class="fchip ${isHidden(s.id) ? '' : 'on'}" data-act="filter-store" data-v="${s.id}">${esc(s.name)}</button>`).join('')}
    </div>`;
  }).join('');
  return `<div class="filters">${groups}<button class="link small" data-act="filter-all">すべて表示</button></div>`;
}
function monthBounds(y, m) { return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(daysIn(y, m))}`]; }

function assignLanes(evs, first, last) {
  const lanes = [];
  return evs.slice().sort((a, b) => a.start.localeCompare(b.start) || diffDays(b.start, evEnd(b)) - diffDays(a.start, evEnd(a)))
    .map(e => {
      const s = e.start < first ? first : e.start;
      const en = evEnd(e) > last ? last : evEnd(e);
      let lane = lanes.findIndex(endDs => endDs < s);
      if (lane < 0) { lane = lanes.length; lanes.push(en); } else lanes[lane] = en;
      return { e, lane, c1: diffDays(first, s) + 1, c2: diffDays(first, en) + 1 };
    });
}
function calStore(y, m) {
  const [first, last] = monthBounds(y, m);
  const n = daysIn(y, m);
  const td = today();
  const days = [];
  for (let i = 0; i < n; i++) { const ds = addDays(first, i); days.push({ ds, d: i + 1, w: dow(ds), cls: dayClass(ds) }); }
  const evs = evList().filter(e => e.start && e.start <= last && evEnd(e) >= first);
  const rows = [
    { label: '大型出展', cls: 'row-big', sid: '__big', events: evs.filter(e => e.type === BIG) },
    { label: '全店共通', cls: 'row-all', sid: 'all', events: evs.filter(e => isAll(e) && e.type !== BIG) }
  ];
  const addStoreRows = (title, ss) => {
    ss = ss.filter(s => !isHidden(s.id));
    if (!ss.length) return;
    rows.push({ block: title });
    ss.forEach(s => rows.push({ label: s.name, sid: s.id, events: evs.filter(e => (e.stores || []).includes(s.id) || (e.type === BIG && isAll(e))) }));
  };
  blocks().forEach(b => addStoreRows(b.name, stores().filter(s => s.blockId === b.id)));
  const bl = blocks().map(b => b.id);
  addStoreRows('(ブロック未設定)', stores().filter(s => !bl.includes(s.blockId)));

  const head = `<div class="sg-row sg-head"><div class="sg-name">店舗</div><div class="sg-days" style="--n:${n}">${days.map(d =>
    `<div class="sg-day ${d.cls} ${d.ds === td ? 'today' : ''}" title="${esc(holidayName(d.ds))}">${d.d}<small>${WD[d.w]}</small></div>`).join('')}</div></div>`;
  const body = rows.map(r => {
    if (r.block) return `<div class="sg-row sg-block"><div class="sg-name">${esc(r.block)}</div><div class="sg-days" style="--n:${n}"></div></div>`;
    const placed = assignLanes(r.events, first, last);
    const lanes = Math.max(1, ...placed.map(p => p.lane + 1));
    const bg = days.map((d, i) => `<div class="sg-bg ${d.cls}" style="grid-column:${i + 1};grid-row:1/-1"></div>`).join('');
    const bars = placed.map(p => `<div class="bar ${typeClass(p.e)}" data-act="edit-event" data-id="${p.e.id}"
        style="grid-column:${p.c1}/${p.c2 + 1};grid-row:${p.lane + 1}"
        title="${esc(p.e.name)}\n${esc(dateRange(p.e))} / ${esc(p.e.type)}\n${esc(storeLabel(p.e))}">${esc(p.e.name)}</div>`).join('');
    return `<div class="sg-row ${r.cls || ''}"><div class="sg-name">${esc(r.label)}</div>
      <div class="sg-track" data-act="track" data-sid="${r.sid}" data-first="${first}" style="--n:${n};--lanes:${lanes}">${bg}${bars}</div></div>`;
  }).join('');
  return `<div class="sg-wrap" id="sg-scroll"><div class="sg">${head}${body}</div></div>
    <p class="muted small-text">空いているところをクリックすると、その日・その店舗でイベントを登録できます。</p>`;
}
function calMonth(y, m) {
  const [first, last] = monthBounds(y, m);
  const start = addDays(first, -dow(first));
  const end = addDays(last, 6 - dow(last));
  const td = today();
  const evs = evList().filter(e => e.start && visibleByFilter(e));
  let cells = '';
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const hol = holidayName(d);
    const chips = evs.filter(e => e.start <= d && evEnd(e) >= d).map(e =>
      `<div class="chip ${typeClass(e)}" data-act="edit-event" data-id="${e.id}" title="${esc(e.name)} / ${esc(storeLabel(e))}">${esc(storeLabel(e))}|${esc(e.name)}</div>`).join('');
    cells += `<div class="mc-cell ${dayClass(d)} ${d < first || d > last ? 'out' : ''} ${d === td ? 'today' : ''}" data-act="day-new" data-date="${d}">
      <div class="mc-date"><b>${Number(d.slice(8))}</b>${hol ? `<span class="mc-hol">${esc(hol)}</span>` : ''}</div>${chips}</div>`;
  }
  return `<div class="mc">${WD.map((w, i) => `<div class="mc-wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}${cells}</div>`;
}
function calList(y, m) {
  const [first, last] = monthBounds(y, m);
  const evs = evList().filter(e => e.start && e.start <= last && evEnd(e) >= first && visibleByFilter(e));
  if (!evs.length) return `<div class="panel empty">この月のイベントはまだありません</div>`;
  return `<div class="table-wrap"><table>
    <tr><th>日付</th><th>イベント名</th><th>種類</th><th>店舗</th><th class="num">予算</th><th class="num">使用金額</th><th>成果</th></tr>
    ${evs.map(e => `<tr class="clickable" data-act="edit-event" data-id="${e.id}">
      <td class="nowrap">${dateRange(e)}</td><td><span class="typetag ${typeClass(e)}"></span>${esc(e.name)}</td>
      <td class="nowrap">${esc(e.type)}</td><td>${esc(storeLabel(e))}</td>
      <td class="num">${yen(budgetOf(e))}</td><td class="num">${yen(usedOf(e))}</td><td>${resultBadge(e)}</td></tr>`).join('')}
  </table></div>`;
}
function resultBadge(e) {
  if (hasResult(e)) return '<span class="badge ok">入力済み</span>';
  if (evEnd(e) < today()) return '<span class="badge warn">未入力</span>';
  return '<span class="badge gray">開催前</span>';
}

// ---------------------------------------------------------------- ToDo
const recentDone = new Set();
function todoItems() {
  const out = [];
  evList().forEach(e => {
    if (!e.start) return;
    TODO_DEFS.forEach(d => out.push({ e, d, key: e.id + ':' + d.key, due: d.due(e), done: todoDone(e, d.key) }));
  });
  return out.sort((a, b) => a.due.localeCompare(b.due));
}
function todoHtml() {
  const items = todoItems();
  const open = items.filter(i => !i.done).length;
  if (state.todoClosed) return `<div class="todo closed"><button data-act="todo-toggle">ToDo(${open})を開く</button></div>`;
  const td = today();
  const shown = items.filter(i => !i.done || state.showDone || recentDone.has(i.key));
  const list = shown.map(i => {
    const left = diffDays(td, i.due);
    const cls = i.done ? '' : left < 0 ? 'over' : left <= 3 ? 'soon' : '';
    const dueText = i.done ? md(i.due) : left < 0 ? `${md(i.due)} 期限切れ` : left === 0 ? '今日まで' : `${md(i.due)} あと${left}日`;
    const auto = i.d.key === 'result' && hasResult(i.e);
    return `<div class="todo-item ${i.done ? 'done' : ''}">
      <input type="checkbox" data-act="todo-check" data-id="${i.e.id}" data-k="${i.d.key}" ${i.done ? 'checked' : ''} ${auto ? 'disabled title="成果を入力したので自動で完了しています"' : ''} aria-label="${esc(i.d.label)}を完了にする">
      <div class="grow">
        <div class="t1">${esc(i.d.label)}</div>
        <div class="t2"><a href="#" data-act="${i.d.key === 'result' ? 'result-event' : 'edit-event'}" data-id="${i.e.id}">${esc(i.e.name)}</a> / ${esc(storeLabel(i.e))}</div>
        <span class="due ${cls}">${dueText}</span>
        ${recentDone.has(i.key) && i.done ? `<button class="link small" data-act="todo-undo" data-id="${i.e.id}" data-k="${i.d.key}">元に戻す</button>` : ''}
      </div></div>`;
  }).join('');
  return `<div class="todo">
    <div class="todo-head"><h3>ToDo</h3><span class="badge gray">${open}件</span><div class="grow"></div>
      <button class="link small" data-act="todo-toggle">閉じる</button></div>
    <label class="chk small-text"><input type="checkbox" data-act="todo-showdone" ${state.showDone ? 'checked' : ''}> 完了したタスクも表示</label>
    ${list || '<div class="empty small-text">やることはありません</div>'}
  </div>`;
}

function fyOptions(sel) {
  const base = fyOf(today());
  const out = [];
  for (let f = base - 3; f <= base + 1; f++) out.push(`<option value="${f}" ${f === sel ? 'selected' : ''}>${kiLabel(f)}</option>`);
  return out.join('');
}
function periodHtml() {
  const p = state.period;
  const modes = { month: '月', quarter: '四半期', fy: '期(年度)' };
  let pick = '';
  if (p.mode === 'month') pick = `<input type="month" id="period-ym" data-act="period-ym" value="${p.ym}">`;
  else {
    pick = `<select id="period-fy" data-act="period-fy">${fyOptions(p.fy)}</select>`;
    if (p.mode === 'quarter') pick += `<select id="period-q" data-act="period-q">${[1, 2, 3, 4].map(q => `<option value="${q}" ${q === p.q ? 'selected' : ''}>${Q_LABEL[q]}</option>`).join('')}</select>`;
  }
  return `<div class="seg">${Object.keys(modes).map(k => `<button class="${p.mode === k ? 'on' : ''}" data-act="period-mode" data-v="${k}">${modes[k]}</button>`).join('')}</div>${pick}`;
}
function periodRange() {
  const p = state.period;
  if (p.mode === 'month') { const [y, m] = p.ym.split('-').map(Number); return monthBounds(y, m); }
  if (p.mode === 'quarter') return quarterRange(p.fy, p.q);
  return [`${p.fy}-04-01`, `${p.fy + 1}-03-31`];
}
function storeSelect(id, act, sel, withAll, placeholder) {
  return `<select id="${id}" data-act="${act}">${withAll ? `<option value="all" ${sel === 'all' ? 'selected' : ''}>全店舗</option>` : ''}
    ${placeholder && !sel ? `<option value="" selected>${esc(placeholder)}</option>` : ''}
    ${blocks().map(b => `<optgroup label="${esc(b.name)}">${stores().filter(s => s.blockId === b.id).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}
    ${stores().filter(s => !blocks().some(b => b.id === s.blockId)).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
  </select>`;
}
function eventsIn(range, sid) {
  return evList().filter(e => e.start && e.start >= range[0] && e.start <= range[1] && (sid === 'all' || participants(e).includes(sid)));
}

// ---------------------------------------------------------------- 四半期計画
function viewPlan() {
  const p = state.plan;
  if (!storeById(p.storeId)) p.storeId = (storesOrdered()[0] || {}).id || '';
  const sid = p.storeId;
  if (!sid) return `<div class="panel empty">店舗がありません。「店舗・ブロック設定」から追加してください</div>`;
  const range = quarterRange(p.fy, p.q);
  const key = `plans/${p.fy}-q${p.q}-${sid}`;
  const plan = getDoc(key) || {};
  const evs = eventsIn(range, sid);
  const budget = num(plan.budget);
  const allocated = sum(evs, e => shareOf(e, sid));
  const other = sum(othersIn(range, sid), c => num(c.amount));
  const used = sum(evs, e => usedShare(e, sid)) + other;
  const rest = budget - allocated - other;
  const memos = (plan.memos || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `
  <div class="view-head">
    ${storeSelect('plan-store', 'plan-store', sid, false)}
    <select id="plan-fy" data-act="plan-fy">${fyOptions(p.fy)}</select>
    <select id="plan-q" data-act="plan-q">${[1, 2, 3, 4].map(q => `<option value="${q}" ${q === p.q ? 'selected' : ''}>${Q_LABEL[q]}</option>`).join('')}</select>
    <span class="muted small-text">${ymd(range[0])}〜${ymd(range[1])}</span>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">四半期予算</div><input type="number" min="0" step="10000" id="plan-budget" data-act="plan-budget" value="${budget || ''}" placeholder="0"></div>
    <div class="card"><div class="lbl">イベントに配分した予算</div><div class="val">${yen(allocated)}</div></div>
    <div class="card"><div class="lbl">イベント以外の費用</div><div class="val">${yen(other)}</div></div>
    <div class="card"><div class="lbl">まだ配分していない予算</div><div class="val ${rest < 0 ? 'neg' : ''}">${yen(rest)}</div></div>
    <div class="card"><div class="lbl">使用金額(イベント以外も含む)</div><div class="val ${used > budget && budget > 0 ? 'neg' : ''}">${yen(used)}</div></div>
  </div>
  <div class="panel">
    <div class="view-head" style="margin-bottom:8px"><h3 style="margin:0">イベント計画</h3><div class="grow"></div>
      <button class="small" data-act="new-event" data-store="${sid}" data-start="${range[0] > today() ? range[0] : (today() <= range[1] ? today() : range[0])}">＋ この店舗のイベントを登録</button></div>
    ${evs.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント名</th><th>種類</th><th>区分</th><th class="num">予算</th><th class="num">使用金額</th></tr>
      ${evs.map(e => `<tr>
        <td class="nowrap">${dateRange(e)}</td>
        <td><a href="#" data-act="edit-event" data-id="${e.id}"><span class="typetag ${typeClass(e)}"></span>${esc(e.name)}</a></td>
        <td class="nowrap">${esc(e.type)}</td>
        <td class="nowrap">${isSingle(e) ? '単独' : isAll(e) ? '全店共通' : '合同'}</td>
        <td class="num">${isSingle(e)
          ? `<input type="number" min="0" step="1000" id="pe-budget-${e.id}" data-act="event-budget" data-id="${e.id}" value="${num(e.budget) || ''}" placeholder="0">`
          : `${yen(shareOf(e, sid))} <button class="link small" data-act="alloc-event" data-id="${e.id}">割り振る</button>`}</td>
        <td class="num">${yen(usedShare(e, sid))}${isSingle(e) ? '' : '<br><span class="muted small-text">按分</span>'}</td>
      </tr>`).join('')}
    </table></div>` : '<div class="empty">この四半期のイベントはまだありません</div>'}
  </div>
  <div class="panel">
    <h3>打ち合わせメモ</h3>
    <div class="memo-form">
      <input type="date" id="memo-date" value="${today()}">
      <textarea id="memo-text" placeholder="打ち合わせの内容"></textarea>
      <button class="primary" data-act="memo-add">追加</button>
    </div>
    ${memos.length ? memos.map(mm => `<div class="memo"><div class="d">${ymd(mm.date)}${mm.by ? `<br>${esc(mm.by)}` : ''}</div><div class="txt">${esc(mm.text)}</div>
      <button class="link small danger-text" data-act="memo-del" data-id="${mm.id}">削除</button></div>`).join('') : '<div class="muted small-text">メモはまだありません</div>'}
  </div>`;
}

// ---------------------------------------------------------------- 実績入力(各店の事務向け:来場実績と費用)
function viewActual() {
  if (state.uStore && !storeById(state.uStore)) state.uStore = '';
  const sid = state.uStore;
  const [y, m] = state.uYm.split('-').map(Number);
  const td = today();
  const head = `
  <div class="view-head">
    <label class="store-pick"><span>店舗</span>${storeSelect('u-store', 'u-store', sid, false, '店舗を選んでください')}</label>
    <div class="month-nav">
      <button data-act="u-month-step" data-v="-1" aria-label="前の月">‹</button>
      <strong>${y}年${m}月</strong>
      <button data-act="u-month-step" data-v="1" aria-label="次の月">›</button>
      <button class="small" data-act="u-month-today">今月</button>
    </div>
  </div>`;
  if (!sid) return head + `<div class="panel empty">はじめに、上の「店舗」であなたの店舗を選んでください。<br><span class="small-text">選んだ店舗はこのパソコン(ブラウザ)に記憶され、次回からは自動で表示されます。</span></div>`;

  const range = monthBounds(y, m);
  const mine = evList().filter(e => e.start && participants(e).includes(sid));
  const evs = mine.filter(e => e.start <= range[1] && evEnd(e) >= range[0]);
  // 月に関係なく、終わったのに実績が入っていないイベント(直近4か月)
  const pending = mine.filter(e => e.start <= td && !hasResult(e) && e.start >= addDays(td, -120));
  const resultBtn = (e, cls) => e.start > td ? '<span class="muted small-text">開催後に入力</span>'
    : hasResult(e) ? `<button class="small" data-act="result-event" data-id="${e.id}">直す</button>`
      : `<button class="primary small ${cls || ''}" data-act="result-event" data-id="${e.id}">${category(e) === 'visit' ? '来場実績' : '実績'}を入力</button>`;
  const evCell = e => `<span class="typetag ${typeClass(e)}"></span>${esc(e.name)}<br><span class="muted small-text">${esc(e.type)}${isSingle(e) ? '' : ' / ' + esc(storeLabel(e))}</span>`;

  const pendingHtml = pending.length ? `<div class="panel todo-panel">
    <h3>来場実績がまだ入っていないイベント(${pending.length}件)</h3>
    <div class="table-wrap"><table>
      ${pending.map(e => `<tr><td class="nowrap">${dateRange(e)}</td><td>${evCell(e)}</td>
        <td class="nowrap right">${resultBtn(e)}</td></tr>`).join('')}
    </table></div></div>` : '';

  const resultTable = evs.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント</th><th>状態</th><th>実績</th><th></th></tr>
      ${evs.map(e => `<tr>
        <td class="nowrap">${dateRange(e)}</td><td>${evCell(e)}</td><td>${resultBadge(e)}</td>
        <td class="small-text">${resultSummary(e)}</td><td class="nowrap right">${resultBtn(e)}</td></tr>`).join('')}
    </table></div>` : '<div class="muted small-text">この月にこの店舗のイベントはありません</div>';

  const rows = costRows(range, sid);
  const evAmt = sum(rows.filter(r => r.kind === 'event'), r => r.amt);
  const otAmt = sum(rows.filter(r => r.kind === 'other'), r => r.amt);
  // この月が入っている四半期の予算の残り(四半期計画と同じ計算)
  const fy = fyOf(range[0]), q = qOf(range[0]), qr = quarterRange(fy, q);
  const qBudget = num((getDoc(`plans/${fy}-q${q}-${sid}`) || {}).budget);
  const qUsed = sum(eventsIn(qr, sid), e => usedShare(e, sid)) + sum(othersIn(qr, sid), c => num(c.amount));

  const list = rows.length ? `<div class="table-wrap"><table>
      <tr><th>時期</th><th>何の費用</th><th>項目</th><th>内容</th><th class="num">金額</th><th>入力者</th><th></th></tr>
      ${rows.map(r => `<tr class="clickable" data-act="cost-edit" data-kind="${r.kind}" data-id="${r.e ? r.e.id : ''}" data-x="${r.x.id}">
        <td class="nowrap">${r.e ? dateRange(r.e) : `${Number(r.date.slice(5, 7))}月分`}</td>
        <td>${r.e ? `<span class="typetag ${typeClass(r.e)}"></span>${esc(r.e.name)}${isSingle(r.e) ? '' : `<br><span class="muted small-text">${esc(storeLabel(r.e))}</span>`}` : '<span class="badge gray">イベント以外</span>'}</td>
        <td class="nowrap">${esc(costName(r.x.costItemId))}</td><td>${esc(r.x.desc || '')}</td>
        <td class="num">${yen(r.full)}${Math.round(r.amt) !== Math.round(r.full) ? `<br><span class="muted small-text">この店舗分 ${yen(r.amt)}</span>` : ''}</td>
        <td class="small-text muted nowrap">${esc(r.by)}</td>
        <td class="nowrap"><button class="link small">編集</button></td></tr>`).join('')}
      <tr class="total"><td colspan="4">この店舗の合計</td><td class="num">${yen(evAmt + otAmt)}</td><td colspan="2"></td></tr>
    </table></div>
    <p class="muted small-text">行をクリックすると、直したり削除したりできます。イベントの費用は開催月に入ります。合同・全店共通イベントの費用は、各店舗に割り振った予算の比率で按分した「この店舗分」を合計しています。</p>`
    : `<div class="empty">${m}月の費用はまだ入力されていません。</div>`;

  const evTable = evs.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント</th><th>区分</th><th class="num">予算(この店舗分)</th><th class="num">使用金額(この店舗分)</th><th class="num">残り</th><th></th></tr>
      ${evs.map(e => {
        const b = shareOf(e, sid), u = usedShare(e, sid);
        return `<tr class="${u > b ? 'over' : ''}">
          <td class="nowrap">${dateRange(e)}</td><td>${evCell(e)}</td>
          <td class="nowrap">${isSingle(e) ? '単独' : isAll(e) ? '全店共通' : '合同'}</td>
          <td class="num">${yen(b)}</td><td class="num">${yen(u)}</td><td class="num ${b - u < 0 ? 'red' : ''}">${yen(b - u)}</td>
          <td class="nowrap"><button class="small" data-act="cost-new" data-ev="${e.id}">＋ 費用</button></td></tr>`;
      }).join('')}
    </table></div>`
    : '<div class="muted small-text">この月にこの店舗のイベントはありません</div>';

  return head + `
  <div class="steps small-text"><b>この画面でやること</b>
    <span>① 終わったイベントの「来場実績を入力」</span><span>② かかった費用を「＋ 費用を入力」</span></div>
  ${pendingHtml}
  <div class="panel">
    <h3><span class="num-badge">1</span>イベントの来場実績(${m}月)</h3>
    ${resultTable}
  </div>
  <div class="panel">
    <div class="view-head" style="margin-bottom:10px"><h3 style="margin:0"><span class="num-badge">2</span>${esc(storeName(sid))} の費用(${m}月)</h3><div class="grow"></div>
      <button class="primary big" data-act="cost-new">＋ 費用を入力</button></div>
    <div class="cards">
      <div class="card"><div class="lbl">${m}月の費用合計</div><div class="val">${yen(evAmt + otAmt)}</div></div>
      <div class="card"><div class="lbl">うち イベントの費用</div><div class="val">${yen(evAmt)}</div></div>
      <div class="card"><div class="lbl">うち イベント以外の費用</div><div class="val">${yen(otAmt)}</div></div>
      <div class="card"><div class="lbl">${Q_LABEL[q]}の予算の残り</div><div class="val ${qBudget && qBudget - qUsed < 0 ? 'neg' : ''}">${qBudget ? yen(qBudget - qUsed) : '<span class="muted" style="font-size:14px;font-weight:400">予算未設定</span>'}</div>
        ${qBudget ? `<div class="muted small-text">予算 ${yen(qBudget)} / 使用 ${yen(qUsed)}</div>` : ''}</div>
    </div>
    ${list}
  </div>
  <div class="panel">
    <h3>イベントごとの予算と使用金額(${m}月)</h3>
    ${evTable}
  </div>`;
}
function resultSummary(e) {
  if (!hasResult(e)) return '';
  const r = e.result;
  return category(e) === 'visit'
    ? `来場 <b>${num(r.visits)}</b>組(新規 ${num(r.newVisits)})/ 次回アポ <b>${num(r.appts)}</b>`
    : `名簿 <b>${num(r.leads)}</b>件 / アポ <b>${num(r.appts)}</b>`;
}

// ---------------------------------------------------------------- 予算管理
function viewBudget() {
  const sid = state.bStore;
  const range = periodRange();
  const evs = eventsIn(range, sid);
  const bOf = e => sid === 'all' ? budgetOf(e) : shareOf(e, sid);
  const uOf = e => sid === 'all' ? usedOf(e) : usedShare(e, sid);
  const tb = sum(evs, bOf), tu = sum(evs, uOf);
  const over = evs.filter(e => uOf(e) > bOf(e));
  // 項目ごとの使用金額
  const byItem = {};
  evs.forEach(e => {
    const r = ratio(e, sid);
    (e.expenses || []).forEach(x => {
      const k = x.costItemId || '';
      byItem[k] = byItem[k] || { total: 0, count: 0 };
      byItem[k].total += num(x.amount) * r; byItem[k].count++;
    });
  });
  const others = othersIn(range, sid);
  const to = sum(others, c => num(c.amount));
  others.forEach(c => {
    const k = c.costItemId || '';
    byItem[k] = byItem[k] || { total: 0, count: 0 };
    byItem[k].total += num(c.amount); byItem[k].count++;
  });
  const itemRows = Object.keys(byItem).sort((a, b) => byItem[b].total - byItem[a].total);
  return `
  <div class="view-head">
    ${periodHtml()}
    ${storeSelect('b-store', 'b-store', sid, true)}
    <div class="grow"></div>
    <button data-act="cost-master">費用項目マスター</button>
  </div>
  ${over.length ? `<div class="banner warn">予算を超えているイベントが ${over.length} 件あります:${over.map(e => esc(e.name)).join('、')}</div>` : ''}
  <div class="cards">
    <div class="card"><div class="lbl">イベント予算の合計</div><div class="val">${yen(tb)}</div></div>
    <div class="card"><div class="lbl">イベントの使用金額</div><div class="val ${tu > tb ? 'neg' : ''}">${yen(tu)}</div></div>
    <div class="card"><div class="lbl">イベント予算の残り</div><div class="val ${tb - tu < 0 ? 'neg' : ''}">${yen(tb - tu)}</div></div>
    <div class="card"><div class="lbl">消化率</div><div class="val">${pct(tu, tb)}</div></div>
    <div class="card"><div class="lbl">イベント以外の費用</div><div class="val">${yen(to)}</div></div>
    <div class="card"><div class="lbl">費用の合計</div><div class="val">${yen(tu + to)}</div></div>
  </div>
  <div class="panel">
    <h3>イベントごとの予算と使用金額</h3>
    ${sid !== 'all' ? '<p class="muted small-text" style="margin-top:-4px">合同・全店共通イベントは、この店舗に割り振った予算と、按分した使用金額を表示しています。明細はイベント全体の金額です。</p>' : ''}
    ${evs.length ? `<div class="table-wrap"><table>
      <tr><th></th><th>日付</th><th>イベント名</th><th>店舗</th><th class="num">予算</th><th class="num">使用金額</th><th class="num">残り</th></tr>
      ${evs.map(e => {
        const b = bOf(e), u = uOf(e), op = !!state.open[e.id];
        return `<tr class="clickable ${u > b ? 'over' : ''}" data-act="toggle-exp" data-id="${e.id}">
          <td>${op ? '▾' : '▸'}</td><td class="nowrap">${dateRange(e)}</td><td><span class="typetag ${typeClass(e)}"></span>${esc(e.name)}</td>
          <td>${esc(storeLabel(e))}</td><td class="num">${yen(b)}</td><td class="num">${yen(u)}</td>
          <td class="num ${b - u < 0 ? 'red' : ''}">${yen(b - u)}</td></tr>
          ${op ? `<tr><td colspan="7" class="exp-box">${expenseEditor(e)}</td></tr>` : ''}`;
      }).join('')}
    </table></div>` : '<div class="empty">この期間のイベントはありません</div>'}
  </div>
  <div class="panel">
    <div class="view-head" style="margin-bottom:8px"><h3 style="margin:0">イベント以外の費用</h3><div class="grow"></div>
      <button class="small" data-act="cost-new" data-target="other" data-store="${sid === 'all' ? '' : sid}">＋ 追加</button></div>
    ${others.length ? `<div class="table-wrap"><table>
      <tr><th>月</th><th>店舗</th><th>項目</th><th>内容</th><th class="num">金額</th><th>入力者</th></tr>
      ${others.map(c => `<tr class="clickable" data-act="cost-edit" data-kind="other" data-x="${c.id}">
        <td class="nowrap">${monthLabel(c.date)}</td><td>${esc(storeName(c.storeId))}</td><td>${esc(costName(c.costItemId))}</td>
        <td>${esc(c.desc || '')}</td><td class="num">${yen(num(c.amount))}</td><td class="small-text muted">${esc(c.updatedBy || c.createdBy || '')}</td></tr>`).join('')}
      <tr class="total"><td colspan="4">合計</td><td class="num">${yen(to)}</td><td></td></tr>
    </table></div>` : '<div class="muted small-text">この期間のイベント以外の費用はありません</div>'}
  </div>
  <div class="panel">
    <h3>項目ごとの使用金額</h3>
    ${itemRows.length ? `<table>
      <tr><th>項目</th><th class="num">件数</th><th class="num">使用金額</th></tr>
      ${itemRows.map(k => `<tr class="clickable" data-act="item-detail" data-v="${esc(k)}"><td>${esc(k ? costName(k) : '(項目なし)')}</td>
        <td class="num">${byItem[k].count}</td><td class="num">${yen(byItem[k].total)}</td></tr>`).join('')}
      <tr class="total"><td>合計</td><td></td><td class="num">${yen(tu + to)}</td></tr>
    </table><p class="muted small-text">イベント以外の費用も含みます。項目をクリックすると「いつ・どのイベントで・何に・いくら」の明細が開きます。</p>` : '<div class="muted small-text">使用金額の明細はまだありません</div>'}
  </div>`;
}
function expenseEditor(e) {
  const xs = e.expenses || [];
  const budgetPart = isSingle(e)
    ? `予算 <input type="number" min="0" step="1000" id="ex-budget-${e.id}" data-act="event-budget" data-id="${e.id}" value="${num(e.budget) || ''}" placeholder="0" style="width:130px"> 円`
    : `予算 ${yen(budgetOf(e))} <button class="small" data-act="alloc-event" data-id="${e.id}">予算を割り振る</button>`;
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">${budgetPart}
    <div class="grow"></div><button class="small" data-act="edit-event" data-id="${e.id}">イベントを編集</button></div>
    <table class="exp">
      <tr><th style="width:170px">項目</th><th>内容</th><th style="width:130px" class="num">金額</th><th style="width:56px"></th></tr>
      ${xs.map(x => `<tr>
        <td><select id="ex-${e.id}-${x.id}-item" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="costItemId">
          ${costItems().map(c => `<option value="${c.id}" ${c.id === x.costItemId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
          ${x.costItemId && !costItems().some(c => c.id === x.costItemId) ? `<option value="${esc(x.costItemId)}" selected>(削除された項目)</option>` : ''}</select></td>
        <td><input id="ex-${e.id}-${x.id}-desc" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="desc" value="${esc(x.desc || '')}" placeholder="例:A4チラシ 5,000部"></td>
        <td><input type="number" id="ex-${e.id}-${x.id}-amount" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="amount" value="${num(x.amount) || ''}" placeholder="0"></td>
        <td class="nowrap"><button class="link small danger-text" data-act="exp-del" data-id="${e.id}" data-x="${x.id}">削除</button></td></tr>`).join('')}
    </table>
    <button class="small" style="margin-top:6px" data-act="exp-add" data-id="${e.id}">＋ 明細を追加</button>`;
}

// ---------------------------------------------------------------- 効果検証
function viewEffect() {
  const sid = state.eStore;
  const evs = eventsIn(periodRange(), sid);
  const uOf = e => sid === 'all' ? usedOf(e) : usedShare(e, sid);
  const visits = evs.filter(e => category(e) === 'visit');
  const exh = evs.filter(e => category(e) === 'exhibit');
  const R = e => e.result || {};
  const missing = evs.filter(e => !hasResult(e) && evEnd(e) < today()).length;
  const tv = (list, f) => sum(list.filter(hasResult), e => num(R(e)[f]));
  const vV = tv(visits, 'visits'), vN = tv(visits, 'newVisits'), vA = tv(visits, 'appts'), vU = sum(visits.filter(hasResult), uOf);
  const xL = tv(exh, 'leads'), xA = tv(exh, 'appts'), xU = sum(exh.filter(hasResult), uOf);
  const cell = (e, v) => hasResult(e) ? v : '';
  const notes = e => {
    const g = R(e).good, i = R(e).improve;
    return [g ? `<b>良</b> ${esc(g)}` : '', i ? `<b>改</b> ${esc(i)}` : ''].filter(Boolean).join('<br>');
  };
  return `
  <div class="view-head">${periodHtml()}${storeSelect('e-store', 'e-store', sid, true)}</div>
  ${missing ? `<div class="banner warn" style="background:var(--warn-weak);color:var(--warn)">終わったのに成果が未入力のイベントが ${missing} 件あります</div>` : ''}
  <div class="panel">
    <h3>来場型イベント</h3>
    ${visits.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント名</th><th>店舗</th><th>状態</th><th class="num">来場組数</th><th class="num">うち新規</th><th class="num">新規率</th><th class="num">次回アポ</th><th class="num">アポ率</th><th class="num">使用金額</th><th class="num">1組あたり</th><th>良かった点・改善点</th></tr>
      ${visits.map(e => { const r = R(e); return `<tr class="clickable" data-act="result-event" data-id="${e.id}">
        <td class="nowrap">${dateRange(e)}</td><td>${esc(e.name)}<br><span class="muted small-text">${esc(e.type)}</span></td><td>${esc(storeLabel(e))}</td><td>${resultBadge(e)}</td>
        <td class="num">${cell(e, num(r.visits))}</td><td class="num">${cell(e, num(r.newVisits))}</td><td class="num">${cell(e, pct(num(r.newVisits), num(r.visits)))}</td>
        <td class="num">${cell(e, num(r.appts))}</td><td class="num">${cell(e, pct(num(r.appts), num(r.visits)))}</td>
        <td class="num">${yen(uOf(e))}</td><td class="num">${cell(e, per(uOf(e), num(r.visits)))}</td><td class="small-text">${notes(e)}</td></tr>`; }).join('')}
      <tr class="total"><td colspan="4">合計(入力済みのみ)</td><td class="num">${vV}</td><td class="num">${vN}</td><td class="num">${pct(vN, vV)}</td><td class="num">${vA}</td><td class="num">${pct(vA, vV)}</td><td class="num">${yen(vU)}</td><td class="num">${per(vU, vV)}</td><td></td></tr>
    </table></div>` : '<div class="empty">この期間の来場型イベントはありません</div>'}
  </div>
  <div class="panel">
    <h3>出展イベント</h3>
    ${exh.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント名</th><th>店舗</th><th>状態</th><th class="num">名簿獲得数</th><th class="num">アポ数</th><th class="num">アポ率</th><th class="num">使用金額</th><th class="num">名簿1件あたり</th><th class="num">アポ1件あたり</th><th>良かった点・改善点</th></tr>
      ${exh.map(e => { const r = R(e); return `<tr class="clickable" data-act="result-event" data-id="${e.id}">
        <td class="nowrap">${dateRange(e)}</td><td>${esc(e.name)}<br><span class="muted small-text">${esc(e.type)}</span></td><td>${esc(storeLabel(e))}</td><td>${resultBadge(e)}</td>
        <td class="num">${cell(e, num(r.leads))}</td><td class="num">${cell(e, num(r.appts))}</td><td class="num">${cell(e, pct(num(r.appts), num(r.leads)))}</td>
        <td class="num">${yen(uOf(e))}</td><td class="num">${cell(e, per(uOf(e), num(r.leads)))}</td><td class="num">${cell(e, per(uOf(e), num(r.appts)))}</td><td class="small-text">${notes(e)}</td></tr>`; }).join('')}
      <tr class="total"><td colspan="4">合計(入力済みのみ)</td><td class="num">${xL}</td><td class="num">${xA}</td><td class="num">${pct(xA, xL)}</td><td class="num">${yen(xU)}</td><td class="num">${per(xU, xL)}</td><td class="num">${per(xU, xA)}</td><td></td></tr>
    </table></div>` : '<div class="empty">この期間の出展イベントはありません</div>'}
  </div>
  <p class="muted small-text">行をクリックすると成果を入力できます。${sid !== 'all' ? '店舗で絞り込んだときの使用金額は按分した額です(成果の数はイベント全体の数)。' : ''}</p>`;
}

// ---------------------------------------------------------------- アカウント管理
async function loadUsers() {
  try { const r = await api('listUsers'); state.users = r.users; render(); }
  catch (e) { toast(e.message, { err: true }); }
}
function viewAccounts() {
  if (!state.users) { loadUsers(); return '<div class="panel empty">読み込み中…</div>'; }
  const users = state.users;
  const me = session.user;
  const admins = users.filter(u => u.role === 'admin').length;
  const q = state.accQ.trim().toLowerCase();
  const list = users.filter(u => (!state.accRole || u.role === state.accRole) && (!q || u.name.toLowerCase().includes(q) || u.email.includes(q)))
    .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));

  return `

      <button class="primary small" data-act="acc-approve" data-id="${u.id}">管理者にする</button>

  <div class="panel">
    <div class="view-head">

      <select id="acc-role" data-act="acc-role-filter"><option value="">すべての権限</option>
        ${['admin', 'manager', 'staff'].map(r => `<option value="${r}" ${state.accRole === r ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('')}</select>
      <div class="grow"></div><button class="small" data-act="acc-reload">最新にする</button>
    </div>
    <div class="table-wrap"><table>
      <tr><th>名前</th><th>メールアドレス</th><th>権限</th><th>登録日時</th><th>最終ログイン</th><th>パスワード</th><th></th></tr>
      ${list.map(u => {

function renderModal() {

}

function allocGrand(m) { return sum(m.draft, a => sum(m.stores, sid => num((a.amounts || {})[sid]))); }
function distribute(total, weights) {
  const W = sum(weights);
  const out = weights.map(w => W > 0 ? Math.floor(total * w / W) : 0);
  let rest = total - sum(out);
  for (let i = 0; rest > 0 && out.length; i = (i + 1) % out.length, rest--) out[i]++;
  return out;
}

const ACT = { click: {}, change: {}, input: {} };
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT.click[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (el.dataset.act === 'modal-bg' && ev.target !== el) return;
  fn(el, ev);
});
['change', 'input'].forEach(type => document.addEventListener(type, ev => {
  const el = ev.target.closest('[data-act]');
  if (el && ACT[type][el.dataset.act]) ACT[type][el.dataset.act](el, ev);
}));
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && modalStack.length) closeModal();
  if (ev.key === 'Enter' && ev.target.id === 'memo-text' && (ev.ctrlKey || ev.metaKey)) ACT.click['memo-add']();

C.track = (el, ev) => {

  const dw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dw')) || 34;
  const idx = Math.max(0, Math.floor((ev.clientX - rect.left) / dw));
  const start = addDays(el.dataset.first, idx);
  const sid = el.dataset.sid;
  const preset = { start };
  if (sid === '__big') preset.type = BIG;

  if (d.target === 'event' && !getEvent(d.eventId)) return modalErr('どのイベントの費用かを選んでください');
  if (d.target === 'other' && !/^\d{4}-\d{2}$/.test(d.month || '')) return modalErr('何月分の費用かを入れてください');
  if (!(num(d.amount) > 0)) return modalErr('金額を入れてください');
  if (!d.costItemId) return modalErr('項目を選んでください');
  const by = session.user.name, at = new Date().toISOString();
  const o = m.orig;
  const id = o ? o.id : uid();
  const rec = { id, costItemId: d.costItemId, desc: d.desc.trim(), amount: num(d.amount) };
  closeModal();
  // 「何の費用か」を変えたときは、元の場所から移す
  if (o && !(o.target === d.target && (d.target === 'other' || o.eventId === d.eventId))) removeCostAt(o);
  const msg = o ? '費用を保存しました' : '費用を入力しました';
  if (d.target === 'event') {
    const e = clone(getEvent(d.eventId));

    const row = Object.assign({}, i >= 0 ? list[i] : {}, rec, { storeId: d.storeId, by, at });
    delete row.date; // イベントの費用は開催月に入れるので日付は持たない
    if (i >= 0) list[i] = row; else list.push(row);
    e.expenses = list;
    saveDoc('events/' + e.id, e, msg);
  } else {
    const prev = getDoc('costs/' + id) || {};
    saveDoc('costs/' + id, Object.assign({}, prev, rec, { date: d.month + '-01',
      storeId: d.storeId, createdBy: prev.createdBy || by, createdAt: prev.createdAt || at, updatedBy: by, updatedAt: at
    }), msg);

function allocAuto(el, byScale) {

}

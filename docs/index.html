<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEALTHYHOME 店舗イベント管理 β版</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7;--panel:#fff;--line:#e1e4e8;--line2:#eef0f2;--text:#1f2933;--muted:#69737f;
  --accent:#5a86c8;--accent-weak:#edf3fb;--danger:#c0645e;--danger-weak:#fbf0ef;
  --bar:#a9c4ea;--bar-over:#efb3ae;--soft-line:#d6e2f3;
  --ok:#4f8a62;--ok-weak:#eef6f0;--warn:#a8783a;--warn-weak:#fdf6ea;
  --sat:#e8f0fe;--sun:#fce8e6;--sat-text:#1a56c4;--sun-text:#c5221f;
  --visit:#3b7be8;--exhibit:#e07b12;--big:#8b3fd9;--allc:#16803c;
  --dw:34px;--namew:132px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}

/* 読み込み中の表示 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{left:-35%}100%{left:100%}}
@keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--soft-line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px;flex:none}
.spinner.lg{width:38px;height:38px;border-width:3px;margin:0}
.spinner.on-btn{border-color:rgba(255,255,255,.4);border-top-color:#fff}
.loading-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 20px}
.loading-box .muted{animation:fade 1.6s ease-in-out infinite}
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
#topbar.on{opacity:1}
#topbar::before{content:'';position:absolute;top:0;height:100%;width:35%;background:var(--bar);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px}
button:hover{background:#f6f8fa}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#4c78b9}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
button.link.danger-text{color:var(--danger)}
button.small{padding:2px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid #cfd4da;border-radius:6px;padding:5px 8px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=number]{text-align:right}
h1,h2,h3{margin:0}
h2{font-size:17px}
h3{font-size:15px;margin-bottom:8px}
.muted{color:var(--muted)}
.small-text{font-size:12px}
.grow{flex:1}
.nowrap{white-space:nowrap}
.right{text-align:right}
.red{color:var(--danger);font-weight:600}

/* ヘッダー */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.2;font-weight:700}
.brand .b1{font-size:11px;letter-spacing:.08em;color:var(--accent)}
.brand .b2{font-size:16px}
.brand .b3{font-size:11px;color:var(--muted);font-weight:600}
.bh-store{border-top:1px dashed var(--line);padding-top:6px !important;margin-top:4px}
.bh-store input.money{width:180px;font-size:16px;font-weight:700}
.auth-brand{display:flex;flex-direction:column;align-items:center;line-height:1.25;font-weight:700;margin-bottom:14px}
.auth-brand .b1{font-size:13px;letter-spacing:.1em;color:var(--accent)}
.auth-brand .b2{font-size:22px}
.auth-brand .b3{font-size:12px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:6px 12px;border-radius:6px;color:var(--muted)}
.tabs button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user{display:flex;align-items:center;gap:6px}
.role{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--line2);color:var(--muted)}
.role.admin{background:#f3e8fd;color:#7b2fbf}
#sync-info{font-size:12px;color:var(--muted)}
#sync-info.err{color:var(--danger)}
.banner{padding:8px 16px;font-size:13px}
.banner.demo{background:var(--warn-weak);color:var(--warn)}
.banner.warn{background:var(--danger-weak);color:var(--danger);border-radius:8px;margin-bottom:12px}

/* レイアウト */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;align-items:start}
.layout.todo-closed{grid-template-columns:minmax(0,1fr) auto}
main{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.view-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:none;border-radius:0;padding:5px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav strong{min-width:90px;text-align:center}

/* 絞り込み */
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;align-items:center}
.fgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fchip{font-size:12px;padding:2px 9px;border-radius:12px}
.fchip.on{background:var(--accent-weak);border-color:#b7cdf7;color:var(--accent)}
.fchip.blk{font-weight:600}

/* 店舗別 */
.sg-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.sg{display:inline-block;min-width:100%}
.sg-row{display:flex;border-bottom:1px solid var(--line2)}
.sg-row:last-child{border-bottom:none}
.sg-name{position:sticky;left:0;z-index:3;flex:0 0 var(--namew);width:var(--namew);background:#fff;padding:4px 8px;border-right:1px solid var(--line);font-size:13px;display:flex;align-items:center}
.sg-head .sg-name{font-weight:600;color:var(--muted)}
.sg-days{display:grid;grid-template-columns:repeat(var(--n),var(--dw))}
.sg-day{text-align:center;font-size:12px;padding:3px 0;line-height:1.2;border-left:1px solid var(--line2)}
.sg-day small{display:block;color:var(--muted);font-size:10px}
.sg-day.sat{background:var(--sat);color:var(--sat-text)}
.sg-day.sun,.sg-day.hol{background:var(--sun);color:var(--sun-text)}
.sg-day.today{box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
.sg-block .sg-name{background:#f7f8fa;font-weight:700;font-size:12px;color:var(--muted)}
.sg-block{background:#f7f8fa}
.sg-track{display:grid;grid-template-columns:repeat(var(--n),var(--dw));grid-template-rows:repeat(var(--lanes),24px);row-gap:3px;padding:4px 0;cursor:copy;position:relative}
.sg-bg{border-left:1px solid var(--line2)}
.sg-bg.sat{background:#f5f8fe}
.sg-bg.sun,.sg-bg.hol{background:#fdf4f3}
.row-big .sg-name{color:var(--big);font-weight:700}
.row-all .sg-name{color:var(--allc);font-weight:700}
.bar{position:relative;z-index:1;margin:0 2px;border-radius:5px;padding:0 6px;font-size:12px;line-height:24px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bar:hover,.chip:hover{filter:brightness(.92)}
.t-visit{background:var(--visit)}
.t-exhibit{background:var(--exhibit)}
.t-big{background:var(--big)}
.t-all{background:var(--allc)}

/* 月カレンダー */
.mc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mc-wd{padding:6px;text-align:center;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);background:#f7f8fa}
.mc-wd.sun{color:var(--sun-text)}.mc-wd.sat{color:var(--sat-text)}
.mc-cell{min-height:96px;padding:4px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);cursor:copy;min-width:0}
.mc-cell:nth-child(7n){border-right:none}
.mc-cell.sat{background:#f8faff}
.mc-cell.sun,.mc-cell.hol{background:#fff8f7}
.mc-cell.out{opacity:.45}
.mc-date{font-size:12px;margin-bottom:3px;display:flex;gap:4px;align-items:baseline}
.mc-cell.sat .mc-date{color:var(--sat-text)}
.mc-cell.sun .mc-date,.mc-cell.hol .mc-date{color:var(--sun-text)}
.mc-cell.today .mc-date b{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px}
.mc-hol{font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{font-size:11px;color:#fff;border-radius:4px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

/* 表 */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f7f8fa;white-space:nowrap}
tr.over td{background:var(--danger-weak)}
tr.total td{font-weight:700;background:#f7f8fa}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f6f8fb}
td.num,th.num{text-align:right;white-space:nowrap}
td input[type=number]{width:110px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.gray{background:var(--line2);color:var(--muted)}
.badge.red{background:var(--danger-weak);color:var(--danger)}
.typetag{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* カード */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.card .lbl{font-size:12px;color:var(--muted)}
.card .val{font-size:20px;font-weight:700;margin-top:2px}
.card .val.neg{color:var(--danger)}
.card input{width:100%;font-size:17px;font-weight:700;margin-top:2px}

/* ToDo */
.todo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.todo-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.todo-head h3{margin:0}
.todo-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.todo-item:last-child{border-bottom:none}
.todo-item input{margin-top:4px}
.todo-item .t1{font-size:13px;font-weight:600}
.todo-item .t2{font-size:12px;color:var(--muted)}
.todo-item.done .t1{text-decoration:line-through;color:var(--muted)}
.due{font-size:11px;padding:0 6px;border-radius:9px;background:var(--line2);color:var(--muted);white-space:nowrap}
.due.over{background:var(--danger-weak);color:var(--danger);font-weight:600}
.due.soon{background:var(--warn-weak);color:var(--warn)}
.todo.closed{padding:6px}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,33,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:620px;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:820px}
.modal h2{margin-bottom:12px}
.modal label,.field{display:block;margin-bottom:11px}
.modal label>span,.field>.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.modal label input:not([type=checkbox]):not([type=radio]),.modal label select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.chk{display:inline-flex !important;align-items:center;gap:5px;margin:0 10px 4px 0 !important;font-size:13px}
.blk{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;margin-top:6px}
.blk-head{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.alloc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.alloc-head,.alloc-auto{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.alloc-auto input{width:140px}
.alloc table td,.alloc table th{padding:4px 8px}
.err{color:var(--danger);font-size:13px;margin-top:6px;min-height:1em}
.temp-pass{font-size:22px;font-weight:700;letter-spacing:2px;background:#f7f8fa;border:1px dashed var(--line);padding:10px;text-align:center;border-radius:8px;margin:10px 0;user-select:all}

/* ログイン */
.auth{max-width:420px;margin:60px auto;padding:0 16px}
.auth .panel{padding:24px}
.auth h1{font-size:20px;margin-bottom:4px}
.auth label{display:block;margin-bottom:12px}
.auth label span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.auth input,.auth select{width:100%}
.auth button.primary{width:100%;padding:9px;margin-top:6px}
.note{font-size:12px;color:var(--muted);background:#f7f8fa;border-radius:6px;padding:8px 10px;margin-bottom:12px}

/* 通知 */
#toast-root{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#202124;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
.toast button{background:none;border:none;color:#8ab4f8;padding:0;font-weight:600}

.memo{border-bottom:1px solid var(--line2);padding:8px 0;display:flex;gap:10px}
.memo:last-child{border-bottom:none}
.memo .d{font-size:12px;color:var(--muted);white-space:nowrap;min-width:84px}
.memo .txt{white-space:pre-wrap;flex:1}
.memo-form{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.memo-form textarea{flex:1;min-height:38px;min-width:200px}
.exp td{padding:4px 6px}
.exp input,.exp select{width:100%}
.exp-box{background:#f9fafb;padding:10px 12px}

/* 実績入力 */
.store-pick{display:flex;align-items:center;gap:8px;font-weight:600}
.store-pick select{font-size:15px;padding:6px 10px;min-width:180px;font-weight:600}
button.big{font-size:15px;padding:8px 18px;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--accent-weak);color:#24426e;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.target-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.target-seg button{text-align:left;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:#fff}
.target-seg button b{display:block;font-size:14px}
.target-seg button small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.target-seg button.on{border-color:var(--bar);background:var(--accent-weak)}
.target-seg button.on b{color:var(--accent)}
.card .small-text{margin-top:2px}
.num-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;margin-right:8px;vertical-align:1px}
.todo-panel{border-color:#f0e0c2;background:#fffcf6}
.todo-panel table{background:transparent}
.rs-ev{background:#f7f8fa;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.rs-num small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.rs-in{display:flex;align-items:center;gap:6px}
.modal .rs-in input{font-size:20px;font-weight:700;padding:6px 10px}
.rs-in em{font-style:normal;color:var(--muted)}
input.money{text-align:right}
.cx-lines{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.cx-line{display:grid;grid-template-columns:minmax(0,1fr) 170px 160px 140px 24px;gap:8px;align-items:center}
.cx-line.cx-head .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.cx-line input,.cx-line select{width:100%}
@media (max-width:700px){.cx-line{grid-template-columns:1fr 1fr}.cx-line.cx-head{display:none}.cx-line input:not(.money){grid-column:1/-1}}
td.act-cell,th.act-cell{width:1%;white-space:nowrap;padding-left:2px;text-align:left}
.bar.prep,.chip.prep{opacity:.35}
.bar.prep:hover,.chip.prep:hover{opacity:.6}
tr.prep td{color:var(--muted)}
.prep-chk{background:var(--accent-weak);border-radius:8px;padding:8px 10px !important;display:flex !important;gap:6px;align-items:center;margin:4px 0 0 !important}
.minutes-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.minutes-form #min-title{flex:1;min-width:160px}
.minutes-form #min-url{flex:2;min-width:220px}
.minutes-url{word-break:break-all}
.stodo-form{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stodo-form input[type=date]{width:140px}
.stodo-form #stodo-text{flex:1;min-width:120px}
.todo-item .t2{margin-left:4px}
.bh-value{font-size:30px;font-weight:700;padding:4px 0}
.view-table th{width:90px;background:none;vertical-align:top}
.store-note{font-size:12px;color:var(--muted)}
.budget-hero{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.3fr);gap:24px;align-items:center;border:1px solid var(--soft-line);background:#f8fbff;padding:18px 20px}
.bh-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:6px}
input.bh-input{width:100%;font-size:30px;font-weight:700;padding:8px 12px;margin-bottom:4px}
.bh-side{border-left:1px solid var(--line);padding-left:24px}
.bh-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
.bh-row b{font-size:17px}
.bh-row.sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted)}
.bh-row.sub b{font-size:15px;color:var(--text)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.dot-alloc{background:var(--bar)}.dot-rest{background:var(--line)}
.bh-bar{height:10px;background:var(--line2);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bh-bar div{height:100%;background:var(--bar)}
.bh-bar div.over{background:var(--bar-over)}
@media (max-width:900px){.budget-hero{grid-template-columns:1fr}.bh-side{border-left:none;padding-left:0}}
td input.money{width:130px}
.cum-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cum-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cum-nums .lbl{display:block;font-size:12px;color:var(--muted)}
.cum-nums b{font-size:18px}
.cum-bar{height:10px;background:var(--line2);border-radius:5px;margin-top:10px;overflow:hidden;display:flex;position:relative}
.cum-bar .cum-act{height:100%;background:var(--bar)}
.cum-bar .cum-plan{height:100%;background:repeating-linear-gradient(45deg,#d3e1f5 0 6px,#e6eefa 6px 12px)}
.cum-bar .cum-act.over{background:var(--bar-over)}
.cum-bar .cum-plan.over{background:repeating-linear-gradient(45deg,#f5d3d0 0 6px,#faeae8 6px 12px)}
.cum-line{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.cum-legend{display:flex;gap:16px;margin-top:6px}
.cum-dot-plan{background:repeating-linear-gradient(45deg,#d3e1f5 0 3px,#e6eefa 3px 6px);border:1px solid var(--soft-line)}
.cum-sub{display:block;margin-top:2px}

<script>
'use strict';
// ====================================================================== 設定
const CFG = window.EVENT_TOOL_CONFIG || {};
const API_URL = String(CFG.apiUrl || '').trim();
const DEMO = !API_URL;
const POLL_MS = 60000;

const VISIT_TYPES = ['完成見学会', 'モデルハウス見学会', '移動型見学会', '相談会', '賑やかし', 'キャンペーン', 'その他'];
const EXHIBIT_TYPES = ['大型出展イベント', '出展イベント'];

const ROLE_LABEL = { admin: '管理者', manager: '店長', employee: '社員', vendor: '事業者', staff: '社員' };
const ROLES = ['admin', 'manager', 'employee', 'vendor'];
// ---------------------------------------------------------------- 権限
// 操作のまとまりごとに、その操作のボタン(data-act)を並べる
const PERM_ACTS = {
  event: ['new-event', 'day-new', 'track', 'ev-save', 'ev-delete', 'ev-delete-ask', 'ev-alloc', 'ev-all', 'ev-store', 'ev-block'],
  plan: ['plan-budget', 'plan-budget-store', 'budget-event', 'alloc-event', 'memo-add', 'memo-del', 'eb-save', 'al-save', 'minutes-add', 'minutes-del'],

// 権限ごとに、できる操作
const ROLE_PERMS = {
  admin: ['event', 'plan', 'result', 'cost', 'config', 'prep'],
  manager: ['event', 'plan', 'result', 'cost'],
  employee: ['cost'],
  vendor: []
};
function myRole() { const r = session.user ? session.user.role : ''; return r === 'staff' ? 'employee' : r; }
function can(perm) { return (ROLE_PERMS[myRole()] || []).includes(perm); }
function permOfAct(act) { return Object.keys(PERM_ACTS).find(p => PERM_ACTS[p].includes(act)); }
function actAllowed(act) { const p = permOfAct(act); return !p || can(p); }
function tabsForRole() {

}
/** できない操作のボタンを隠す(行のクリックは無効にするだけで行は見せる) */
function applyPermStyle() {
  const ng = [].concat(...Object.keys(PERM_ACTS).filter(p => !can(p)).map(p => PERM_ACTS[p]));
  let el = $('perm-style');
  if (!el) { el = document.createElement('style'); el.id = 'perm-style'; document.head.appendChild(el); }
  el.textContent = ng.length ? ng.map(a => `button[data-act="${a}"],a[data-act="${a}"]`).join(',') + '{display:none !important}'
    + ng.map(a => `[data-act="${a}"]`).join(',') + '{cursor:default !important}' : '';
}
/** 登録時に選んだ店舗を、各画面の最初の店舗にする(カレンダーは全店) */

}
const WD = ['日', '月', '火', '水', '木', '金', '土'];

const TODO_DEFS = [

// ====================================================================== 小さな道具
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = Number(String(v == null ? '' : v).replace(/[,¥\s円]/g, '')); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const pct = (a, b) => b > 0 ? (a / b * 100).toFixed(1) + '%' : '—';
const per = (a, b) => b > 0 ? yen(a / b) : '—';
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/** 金額の入力欄。打つと自動で「¥」と「,」が入る(上下ボタンなし) */
function moneyInput(attrs, v, ph) {
  const n = num(v);
  let cls = 'money';
  attrs = attrs.replace(/class="([^"]*)"/, (_, c) => { cls += ' ' + c; return ''; });
  return `<input type="text" inputmode="numeric" class="${cls}" autocomplete="off" ${attrs} value="${n ? yen(n) : ''}" placeholder="${esc(ph || '¥0')}">`;
}
function formatMoney(el) {
  const raw = el.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const pos = el.selectionStart == null ? raw.length : el.selectionStart;
  const before = raw.slice(0, pos).replace(/\D/g, '').replace(/^0+/, '').length;
  const d = raw.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  el.value = d ? '¥' + Number(d).toLocaleString('ja-JP') : '';
  let i = 1, c = 0; // カーソルを同じ数字の後ろに戻す
  while (i < el.value.length && c < before) { if (/\d/.test(el.value[i])) c++; i++; }
  if (!el.value) return;
  try { if (document.activeElement === el) el.setSelectionRange(i, i); } catch (e) { }
}
document.addEventListener('input', ev => { if (ev.target.classList && ev.target.classList.contains('money') && !ev.isComposing) formatMoney(ev.target); }, true);
document.addEventListener('compositionend', ev => { if (ev.target.classList && ev.target.classList.contains('money')) formatMoney(ev.target); }, true);

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function lsJSON(k, def) { try { const v = JSON.parse(lsGet(k)); return v == null ? def : v; } catch (e) { return def; } }

// 日付は 'YYYY-MM-DD' の文字列で扱う
function toDS(d) { return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function fromDS(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function addDays(s, n) { const d = fromDS(s); d.setUTCDate(d.getUTCDate() + n); return toDS(d); }
function diffDays(a, b) { return Math.round((fromDS(b) - fromDS(a)) / 86400000); }
function dow(s) { return fromDS(s).getUTCDay(); }
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function md(s) { if (!s) return ''; const [, m, d] = s.split('-').map(Number); return `${m}/${d}(${WD[dow(s)]})`; }
function ymd(s) { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${y}/${m}/${d}(${WD[dow(s)]})`; }
function monthLabel(s) { if (!s) return ''; const [y, m] = s.split('-').map(Number); return `${y}年${m}月分`; }
function dateRange(e) { const en = evEnd(e); return en !== e.start ? `${md(e.start)}〜${md(en)}` : md(e.start); }
function fyOf(s) { const [y, m] = s.split('-').map(Number); return m >= 4 ? y : y - 1; }
function qOf(s) { const m = Number(s.split('-')[1]); return m >= 4 && m <= 6 ? 1 : m >= 7 && m <= 9 ? 2 : m >= 10 ? 3 : 4; }
function kiLabel(fy) { return `${fy - 1990}期(${fy}年度)`; }
const Q_LABEL = { 1: 'Q1(4〜6月)', 2: 'Q2(7〜9月)', 3: 'Q3(10〜12月)', 4: 'Q4(1〜3月)' };
function quarterRange(fy, q) {
  const r = { 1: [`${fy}-04-01`, `${fy}-06-30`], 2: [`${fy}-07-01`, `${fy}-09-30`], 3: [`${fy}-10-01`, `${fy}-12-31`], 4: [`${fy + 1}-01-01`, `${fy + 1}-03-31`] };
  return r[q];
}
function fmtDT(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 祝日(2020年以降の法律にもとづいて計算)
const holCache = {};
function nthMonday(y, m, n) { const w = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); return 1 + (8 - w) % 7 + 7 * (n - 1); }
function holidaysFor(y) {
  if (holCache[y]) return holCache[y];
  const h = {};
  const add = (m, d, n) => { h[`${y}-${pad(m)}-${pad(d)}`] = n; };
  const k = y - 1980;
  add(1, 1, '元日'); add(1, nthMonday(y, 1, 2), '成人の日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日');
  add(3, Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4)), '春分の日');
  add(4, 29, '昭和の日'); add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  add(7, nthMonday(y, 7, 3), '海の日'); add(8, 11, '山の日'); add(9, nthMonday(y, 9, 3), '敬老の日');
  add(9, Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4)), '秋分の日');
  add(10, nthMonday(y, 10, 2), 'スポーツの日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  const base = Object.keys(h).sort();
  base.forEach(d => { // 国民の休日(祝日にはさまれた平日)
    const mid = addDays(d, 1), next = addDays(d, 2);
    if (h[next] && !h[mid] && dow(mid) !== 0) h[mid] = '国民の休日';
  });
  base.forEach(d => { // 振替休日
    if (dow(d) !== 0) return;
    let n = addDays(d, 1);
    while (h[n]) n = addDays(n, 1);
    h[n] = '振替休日';
  });
  return (holCache[y] = h);
}
function holidayName(s) { return holidaysFor(Number(s.slice(0, 4)))[s] || ''; }
function dayClass(s) { const w = dow(s); return holidayName(s) ? 'hol' : w === 0 ? 'sun' : w === 6 ? 'sat' : ''; }

// ====================================================================== 通信
const session = { token: lsGet('evt-token'), user: null };

let busyCount = 0;
function setBusy(d) {
  busyCount = Math.max(0, busyCount + d);
  const el = $('topbar'); if (el) el.classList.toggle('on', busyCount > 0);
}
function loadingHtml(text) { return `<div class="loading-box"><span class="spinner lg"></span><div class="muted">${esc(text)}</div></div>`; }
async function api(action, params, quiet) {
  const body = Object.assign({ action, token: session.token }, params || {});
  let res;
  if (!quiet) setBusy(1);
  try {
    if (DEMO) res = await demoApi(body);
    else {
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = ctl && setTimeout(() => ctl.abort(), API_TIMEOUT_MS);
      try {
        const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: ctl ? ctl.signal : undefined });
        res = await r.json();
      } finally { clearTimeout(timer); }
    }
  } catch (e) {
    if (!quiet) setBusy(-1);
    throw new Error('サーバーにつながりませんでした。ネットワークを確認してください');
  }
  if (!quiet) setBusy(-1);
  if (!res || !res.ok) {
    const err = new Error((res && res.error) || 'エラーが起きました');
    err.code = res && res.code;
    if (err.code === 'AUTH') setTimeout(() => forceLogout(err.message), 0);
    if (err.code === 'MUST_CHANGE') setTimeout(() => showAuth('change'), 0);
    throw err;
  }
  return res;
}

// ---------------------------------------------------------------- お試しモード(ブラウザ内だけで動く代わりのサーバー)
async function sha(s) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return btoa(String.fromCharCode.apply(null, new Uint8Array(b)));
  }
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h);
}
async function demoApi(req) {
  await new Promise(r => setTimeout(r, 120));
  const db = lsJSON('evt-demo-db', null) || { users: [], sessions: [], data: {}, ver: 0 };
  const save = () => lsSet('evt-demo-db', JSON.stringify(db));
  const ng = (error, code) => ({ ok: false, error, code });
  const pub = u => ({ id: u.id, email: u.email, name: u.name, role: u.role === 'staff' ? 'employee' : u.role, requestedRole: u.requestedRole || '', mustChange: !!u.mustChange, createdAt: u.createdAt, lastLogin: u.lastLogin, storeId: u.storeId || '' });
  const hash = (p, salt) => sha(salt + ':' + p);
  const newSession = uidv => { const t = uid() + uid(); db.sessions.push({ token: t, userId: uidv }); return t; };
  const listUsers = () => ({ ok: true, users: db.users.map(pub) });
  const email = String(req.email || '').trim().toLowerCase();
  const now = new Date().toISOString();
  switch (req.action) {
    case 'status': return { ok: true, hasUsers: db.users.length > 0, stores: db.data['config/stores'] && !db.data['config/stores'].deleted ? db.data['config/stores'].value : null };
    case 'register': {
      const name = String(req.name || '').trim();
      if (!name) return ng('名前を入力してください');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ng('メールアドレスの形式が正しくありません');
      if (String(req.password || '').length < 8) return ng('パスワードは8文字以上にしてください');
      if (db.users.some(u => u.email === email)) return ng('このメールアドレスはすでに登録されています');
      const first = db.users.length === 0;
      let role = req.role, requestedRole = '';
      if (role === 'admin' && !first) { role = 'manager'; requestedRole = 'admin'; }
      if (first) role = 'admin';
      const salt = uid();
      if (!req.storeId) return ng('店舗を選んでください');
      const u = { id: uid(), email, name, role, requestedRole, salt, hash: await hash(req.password, salt), mustChange: false, createdAt: now, lastLogin: now, storeId: req.storeId };
      db.users.push(u);
      const token = newSession(u.id); save();
      return { ok: true, token, user: pub(u) };
    }
    case 'login': {
      const u = db.users.find(x => x.email === email);
      if (!u || await hash(String(req.password || ''), u.salt) !== u.hash) return ng('メールアドレスまたはパスワードが違います');
      u.lastLogin = now; const token = newSession(u.id); save();
      const docs = {}; Object.entries(db.data).forEach(([k, r]) => { if (!r.deleted) docs[k] = r.value; });
      return { ok: true, token, user: pub(u), docs, version: db.ver };
    }
  }
  const s = db.sessions.find(x => x.token === req.token);
  const me = s && db.users.find(u => u.id === s.userId);
  if (!me) return ng('ログインの有効期限が切れました。もう一度ログインしてください', 'AUTH');
  if (me.mustChange && !['changePassword', 'me', 'logout'].includes(req.action)) return ng('仮パスワードを変更してください', 'MUST_CHANGE');
  const adminOnly = ['listUsers', 'approveAdmin', 'rejectAdmin', 'setRole', 'setStore', 'resetPassword', 'deleteUser'];
  if (adminOnly.includes(req.action) && me.role !== 'admin') return ng('管理者だけが使える操作です');
  const target = db.users.find(u => u.id === req.userId);
  const admins = db.users.filter(u => u.role === 'admin').length;
  switch (req.action) {
    case 'me': return { ok: true, user: pub(me) };
    case 'logout': db.sessions = db.sessions.filter(x => x.token !== req.token); save(); return { ok: true };
    case 'changePassword': {
      if (await hash(String(req.current || ''), me.salt) !== me.hash) return ng('今のパスワードが違います');
      if (String(req.password || '').length < 8) return ng('新しいパスワードは8文字以上にしてください');
      me.salt = uid(); me.hash = await hash(req.password, me.salt); me.mustChange = false; save();
      return { ok: true, user: pub(me) };
    }
    case 'load': case 'changes': {
      const since = req.action === 'load' ? 0 : Number(req.since) || 0;
      const docs = {};
      Object.entries(db.data).forEach(([k, r]) => {
        if (r.updatedAt <= since) return;
        if (req.action === 'load' && r.deleted) return;
        docs[k] = r.deleted ? null : r.value;
      });
      return { ok: true, docs, version: db.ver, user: pub(me) };
    }
    case 'put': db.ver++; db.data[req.key] = { value: req.value, updatedAt: db.ver, deleted: false }; save(); return { ok: true, version: db.ver };
    case 'remove': db.ver++; db.data[req.key] = { value: null, updatedAt: db.ver, deleted: true }; save(); return { ok: true, version: db.ver };
    case 'listUsers': return listUsers();
    case 'approveAdmin': if (target) { target.role = 'admin'; target.requestedRole = ''; } save(); return listUsers();
    case 'rejectAdmin': if (target) target.requestedRole = ''; save(); return listUsers();
    case 'setStore':
      if (!target) return ng('アカウントが見つかりません');
      target.storeId = req.storeId; save(); return listUsers();
    case 'setRole':
      if (!target) return ng('アカウントが見つかりません');
      if (target.role === 'admin' && req.role !== 'admin' && admins <= 1) return ng('最後の1人の管理者の権限は変更できません');
      target.role = req.role; target.requestedRole = ''; save(); return listUsers();
    case 'resetPassword': {
      if (!target) return ng('アカウントが見つかりません');
      const temp = Math.random().toString(36).slice(2, 7) + Math.random().toString(36).slice(2, 7);
      target.salt = uid(); target.hash = await hash(temp, target.salt); target.mustChange = true;
      db.sessions = db.sessions.filter(x => x.userId !== target.id); save();
      return { ok: true, tempPassword: temp };
    }
    case 'deleteUser':

let docs = {};          // "collection/id" → 値
let version = 0;        // ここまでの変更を受け取った印
let lastSync = null;

let pendingWrites = 0;
const writingKeys = new Set();

function getDoc(k) { return docs[k] || null; }
function storesCfg() { const d = getDoc('config/stores'); return d && Array.isArray(d.stores) ? d : DEFAULT_STORES; }
function blocks() { return storesCfg().blocks || []; }
function stores() { return storesCfg().stores || []; }
function storesOrdered() {
  const bl = blocks().map(b => b.id);
  const out = [];
  bl.forEach(b => stores().filter(s => s.blockId === b).forEach(s => out.push(s)));
  stores().filter(s => !bl.includes(s.blockId)).forEach(s => out.push(s));
  return out;
}
/** 四半期計画で合算して見る店舗のまとまり */
const PLAN_GROUPS = [{ id: 'grp_barazono', name: 'バラ園＋バラ園２', stores: ['st_barazono', 'st_barazono2'] }];
function planGroup(id) { const g = PLAN_GROUPS.find(x => x.id === id); return g && g.stores.every(storeById) ? g : null; }
function storeById(id) { return stores().find(s => s.id === id); }
function storeName(id) { if (id === 'all') return '全店共通'; if (String(id).startsWith('co:')) return String(id).slice(3); const s = storeById(id); return s ? s.name : '(削除された店舗)'; }
function costItems() { const d = getDoc('config/costItems'); return d && Array.isArray(d.items) ? d.items : DEFAULT_COST_ITEMS.items; }
const OLD_COST_ITEMS = { ci_paper: '新聞折込' }; // 選べなくなった項目(以前の入力の表示用)
function costName(id) { const c = costItems().find(x => x.id === id); return c ? c.name : OLD_COST_ITEMS[id] || '(削除された項目)'; }

function evList() {
  return Object.keys(docs).filter(k => k.startsWith('events/') && docs[k]).map(k => docs[k])
    .sort((a, b) => (a.start || '').localeCompare(b.start || '') || (a.name || '').localeCompare(b.name || ''));
}
function getEvent(id) { return getDoc('events/' + id); }
function evEnd(e) { return e.end && e.end >= e.start ? e.end : e.start; }
function isAll(e) { return (e.stores || []).includes('all'); }
function isSingle(e) { return !isAll(e) && (e.stores || []).length === 1; }
function participants(e) { return isAll(e) ? stores().map(s => s.id) : (e.stores || []).slice(); }
function category(e) { return EXHIBIT_TYPES.includes(e.type) ? 'exhibit' : 'visit'; }
/** 管理者が「準備完了」にしたイベントは、管理者の画面でだけ薄く表示する */
function prepCls(e) { return myRole() === 'admin' && e.prepared ? ' prep' : ''; }
function prepMark(e) { return myRole() === 'admin' && e.prepared ? '✓ ' : ''; }
function typeClass(e) { return e.type === BIG ? 't-big' : category(e) === 'exhibit' ? 't-exhibit' : isAll(e) ? 't-all' : 't-visit'; }
function storeLabel(e) {
  if (isAll(e)) return '全店共通';
  const n = (e.stores || []).map(storeName);
  return n.length > 2 ? `${n[0]}・${n[1]} 他${n.length - 2}店` : n.join('・');
}
function allocTotal(e) { return sum(e.allocations || [], a => sum(Object.values(a.amounts || {}), num)); }
function budgetOf(e) { return isSingle(e) ? num(e.budget) : allocTotal(e); }
function shareOf(e, sid) {
  if (isSingle(e)) return e.stores[0] === sid ? num(e.budget) : 0;
  return sum(e.allocations || [], a => num((a.amounts || {})[sid]));
}
function usedOf(e) { return sum(e.expenses || [], x => num(x.amount)); }
/**
 * 費用明細1件のうち、その店舗の分。
 * 合同・全店共通は、明細を入れた店舗(storeId)の分(イベント全体は各店舗の積み上げ)。
 * 店舗が付いていない以前の明細だけは、これまでどおり割り振った予算の比率で按分する。
 */
function expShare(e, x, sid) {
  const a = num(x.amount);
  if (sid === 'all') return a;
  if (isSingle(e)) return e.stores[0] === sid ? a : 0;
  const p = participants(e);
  if (!p.includes(sid)) return 0;
  if (x.storeId && p.includes(x.storeId)) return x.storeId === sid ? a : 0;
  const tot = budgetOf(e);
  return tot > 0 ? a * shareOf(e, sid) / tot : a / p.length; // 以前の明細
}
/** その店舗の明細か(合同イベントで、ほかの店舗が入れた明細は false) */
function expMine(e, x, sid) { return sid === 'all' || isSingle(e) || !(x.storeId && participants(e).includes(x.storeId)) || x.storeId === sid; }
/** 店舗ごとの使用金額 */
function usedShare(e, sid) { return sum(e.expenses || [], x => expShare(e, x, sid)); }
/** その店舗の費用が1件でも入っているか */
function hasCostFor(e, sid) { return (e.expenses || []).some(x => expMine(e, x, sid) && (sid === 'all' || participants(e).includes(sid))); }
function todoDone(e, key) {
  if (key === 'result' && allEntered(e)) return true;
  return !!(e.todos && e.todos[key]);
}
/** 合同・全店共通の来場型イベントは、店舗ごとに反響実績を入れる(出展はイベント全体で1つ) */
function perStore(e) { return category(e) === 'visit' && !isSingle(e); }
function storeResult(e, sid) { const r = getDoc(`results/${e.id}~${sid}`); return r && r.entered ? r : null; }
/** その店舗の実績(sid が 'all' や空なら全体の合計) */
function resultOf(e, sid) {
  const whole = e.result && e.result.entered ? e.result : null;
  if (!perStore(e)) return whole;
  if (sid && sid !== 'all') return storeResult(e, sid);
  const list = participants(e).map(id => storeResult(e, id)).filter(Boolean);
  if (!list.length) return whole; // 以前のやり方(イベント全体で1つ)で入っていたもの
  const f = k => sum(list, r => num(r[k]));
  return { entered: true, visits: f('visits'), newVisits: f('newVisits'), appts: f('appts'),
    note: list.filter(r => r.note).map(r => `${storeName(r.storeId)}:${r.note}`).join(' / ') };
}
function hasResult(e, sid) { return !!resultOf(e, sid); }
function resultCount(e) { return perStore(e) ? participants(e).filter(id => storeResult(e, id)).length : (hasResult(e) ? 1 : 0); }
function allEntered(e) { return perStore(e) ? (participants(e).every(id => storeResult(e, id)) || !!(e.result && e.result.entered)) : hasResult(e); }

/**
 * 年度の初め(Q1)から q 四半期目までの累計と着地見込み。
 * 着地見込み = 終わった四半期は実績。今と先の四半期はイベントごとに「費用が入っていれば実績、まだなら配分した予算」。
 * イベント以外の費用はいつでも実績。
 */
function cumulative(fy, q, sid) {
  const ids = sid === 'all' ? stores().map(s => s.id) : Array.isArray(sid) ? sid : [sid];
  const td = today();
  let budget = 0, actual = 0, planned = 0;
  const quarters = [];
  for (let i = 1; i <= q; i++) {
    const r = quarterRange(fy, i);
    const t = { q: i, budget: 0, actual: 0, planned: 0, past: r[1] < td };
    ids.forEach(id => {
      t.budget += num((getDoc(`plans/${fy}-q${i}-${id}`) || {}).budget);
      eventsIn(r, id).forEach(e => {
        if (t.past || hasCostFor(e, id)) t.actual += usedShare(e, id);
        else t.planned += shareOf(e, id);
      });
      t.actual += sum(othersIn(r, id), c => num(c.amount));
    });
    budget += t.budget; actual += t.actual; planned += t.planned;
    quarters.push(t);
  }
  return { fy, q, budget, actual, planned, used: actual + planned, quarters, range: [quarterRange(fy, 1)[0], quarterRange(fy, q)[1]] };
}
function cumulativeHtml(c) {
  const B = c.budget > 0 ? c.budget : 0;
  const over = B > 0 && c.used > B;
  const scale = Math.max(B, c.used) || 1; // 予算を超えたらバーは見込みの長さに合わせる
  const [, m1] = c.range[0].split('-').map(Number), [, m2] = c.range[1].split('-').map(Number);
  const chip = t => t.past || !t.planned
    ? `<span class="qchip act"><b>Q${t.q}</b> 実績 ${yen(t.actual)}</span>`
    : `<span class="qchip mix"><b>Q${t.q}</b> 実績 ${yen(t.actual)} ＋ 配分予算 ${yen(t.planned)}</span>`;
  return `<div class="panel cum">
    <div class="cum-head"><h3 style="margin:0">年度の累計と着地見込み</h3><span class="muted small-text">${kiLabel(c.fy)} ${m1}月〜${m2}月(Q1〜Q${c.q})</span></div>
    <div class="cum-nums">
      <div><span class="lbl">予算の累計</span><b>${B ? yen(B) : '未設定'}</b></div>
      <div><span class="lbl">着地見込み(実績＋配分予算)</span><b class="${over ? 'red' : ''}">${yen(c.used)}</b>
        <span class="muted small-text cum-sub">実績 ${yen(c.actual)} / 配分予算 ${yen(c.planned)}</span></div>
      <div><span class="lbl">残り(見込み)</span><b class="${over ? 'red' : ''}">${B ? yen(B - c.used) : '—'}</b></div>
      <div><span class="lbl">消化率(見込み)</span><b class="${over ? 'red' : ''}">${pct(c.used, B)}</b>
        <span class="muted small-text cum-sub">実績だけなら ${pct(c.actual, B)}</span></div>
    </div>
    ${B ? `<div class="cum-bar"><div class="cum-act${over ? ' over' : ''}" style="width:${c.actual / scale * 100}%"></div><div class="cum-plan${over ? ' over' : ''}" style="width:${c.planned / scale * 100}%"></div>${over ? `<i class="cum-line" style="left:${B / scale * 100}%"></i>` : ''}</div>
      <div class="cum-legend small-text muted"><span><i class="dot dot-alloc"></i>実績</span><span><i class="dot cum-dot-plan"></i>配分予算(まだ費用が入っていないイベント)</span></div>` : ''}
    <div class="qchips">${c.quarters.map(chip).join('')}</div>
    <p class="muted small-text" style="margin:4px 0 0">着地見込みは、終わった四半期は<b>実績</b>、今と先の四半期はイベントごとに<b>費用が入っていれば実績、まだなら配分した予算</b>で数えています(イベント以外の費用は実績)。${B ? '' : '四半期計画で各四半期の予算を入れると、累計の予算と消化率が出ます。'}</p>
  </div>`;
}

// イベントに紐付かない費用(costs/{id})
function costList() { return Object.keys(docs).filter(k => k.startsWith('costs/') && docs[k]).map(k => docs[k]); }
function othersIn(range, sid) {
  return costList().filter(c => c.date && c.date >= range[0] && c.date <= range[1] && (sid === 'all' || c.storeId === sid))
    .sort((a, b) => a.date.localeCompare(b.date));
}
/** 店舗・期間の費用明細(イベントの費用+イベント以外の費用)。amt はその店舗の分 */
function costRows(range, sid) {
  const rows = [];
  evList().forEach(e => {
    if (sid !== 'all' && !participants(e).includes(sid)) return;
    (e.expenses || []).forEach(x => {
      const d = e.start; // イベントの費用は開催月に入れる
      if (!expMine(e, x, sid)) return; // ほかの店舗が入れた明細
      if (d && d >= range[0] && d <= range[1]) rows.push({ kind: 'event', e, x, date: d, full: num(x.amount), amt: expShare(e, x, sid), by: x.by || '' });
    });
  });
  othersIn(range, sid).forEach(c => rows.push({ kind: 'other', x: c, date: c.date, full: num(c.amount), amt: num(c.amount), by: c.updatedBy || c.createdBy || '' }));
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------------------------------------------------------------- 読み込み・保存
async function loadAll() {
  const r = await api('load');
  applyLoaded(r);
}
function applyLoaded(r) {
  const next = r.docs || {};
  writingKeys.forEach(k => { if (k in docs) next[k] = docs[k]; else delete next[k]; }); // 保存中のものは手元を優先
  docs = next;
  version = r.version || 0;
  if (r.user) session.user = r.user;
  lastSync = new Date();
  cacheSave();
}

// ---------------------------------------------------------------- 前回の内容をブラウザに覚えておき、次に開いたときすぐ表示する
const CACHE_KEY = 'evt-cache';
let cacheTimer = null, refreshing = false;
function cacheSave() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    if (session.user && session.token) lsSet(CACHE_KEY, JSON.stringify({ token: session.token, user: session.user, docs, version }));
  }, 500);
}
function cacheLoad() {
  const c = lsJSON(CACHE_KEY, null);
  return c && c.docs && c.user && c.token === session.token ? c : null;
}
/** 覚えていた内容で表示したあと、裏で最新の内容を読み込む */
async function refreshInBackground() {
  refreshing = true; polling = true; renderSyncInfo();
  const before = JSON.stringify(session.user);
  try {
    await loadAll();
    if (!session.user) return;
    if (JSON.stringify(session.user) !== before) { applyPermStyle(); applyStoreDefaults(); $('root').innerHTML = shellHtml(); render(); }
    else softRender();
  } catch (e) {
    if (e.code !== 'AUTH' && e.code !== 'MUST_CHANGE') { pollError = e.message; toast('最新の内容を読み込めませんでした:' + e.message, { err: true }); }
  } finally {
    refreshing = false; polling = false; renderSyncInfo();
  }
}

async function saveDoc(key, value, msg) {
  docs[key] = value;
  scheduleRender();
  await write(key, () => api('put', { key, value }), msg);
}
async function removeDoc(key, msg) {
  delete docs[key];
  scheduleRender();
  await write(key, () => api('remove', { key }), msg);
}
async function write(key, fn, msg) {
  pendingWrites++; writingKeys.add(key); syncState = 'saving'; renderSyncInfo();
  try {
    await fn();
    if (msg) toast(msg);
    cacheSave();
    syncState = '';
  } catch (e) {
    syncState = 'error';
    toast('保存できませんでした:' + e.message, { err: true });
    resync();
  } finally {
    pendingWrites--; writingKeys.delete(key);
    renderSyncInfo();
  }
}

/** 保存に失敗したときは、サーバーの内容を読み直して画面と食い違わないようにする */
async function resync() {
  try { await loadAll(); render(); } catch (e) { }
}

let polling = false;
let pollError = null; // 自動更新が失敗しているときの理由
async function poll(manual) {
  if (!session.user) return;
  if (polling) { if (manual) toast('いま確認中です。少し待ってください'); return; }
  polling = true;
  try {
    const r = await api('changes', { since: version }, !manual);
    let changed = false;
    Object.keys(r.docs || {}).forEach(k => {
      if (writingKeys.has(k)) return; // 自分が保存中のものは上書きしない
      const v = r.docs[k];
      if (JSON.stringify(docs[k] == null ? null : docs[k]) === JSON.stringify(v)) return;
      changed = true;
      if (v === null) delete docs[k]; else docs[k] = v;
    });
    version = Math.max(version, r.version || 0);
    if (r.user) session.user = r.user;
    lastSync = new Date();
    pollError = null;
    cacheSave();
    if (state.tab === 'accounts' && manual) loadUsers();
    if (changed) softRender(); else renderSyncInfo();
    if (manual) toast(changed ? '最新の内容に更新しました' : '最新の状態です');
  } catch (e) {
    pollError = e.message;
    renderSyncInfo();
    if (manual) toast(e.message, { err: true });
  } finally {
    polling = false;
  }
}
setInterval(() => { if (document.visibilityState === 'visible') poll(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
window.addEventListener('focus', () => poll());
window.addEventListener('online', () => poll());

  const [y, m] = state.ym.split('-').map(Number);
  const modes = { store: '店舗別', month: 'カレンダー', list: '一覧' };
  return `
  <div class="view-head">
    <div class="seg">${Object.keys(modes).map(k => `<button class="${state.calMode === k ? 'on' : ''}" data-act="cal-mode" data-v="${k}">${modes[k]}</button>`).join('')}</div>
    <div class="month-nav">
      <button data-act="month-step" data-v="-1" aria-label="前の月">‹</button>
      <strong>${y}年${m}月</strong>
      <button data-act="month-step" data-v="1" aria-label="次の月">›</button>
      <button class="small" data-act="month-today">今月</button>
    </div>
    <div class="grow"></div>
    <span class="muted small-text">
      <span class="typetag t-visit"></span>来場型
      <span class="typetag t-all" style="margin-left:8px"></span>全店共通
      <span class="typetag t-exhibit" style="margin-left:8px"></span>出展
      <span class="typetag t-big" style="margin-left:8px"></span>大型出展
      ${can('prep') ? '<span style="margin-left:10px">✓ 準備完了は薄く表示</span>' : ''}
    </span>
    <button class="primary" data-act="new-event">＋ イベントを登録</button>
  </div>
  ${filterHtml()}
  ${state.calMode === 'month' ? calMonth(y, m) : state.calMode === 'list' ? calList(y, m) : calStore(y, m)}`;
}
function filterHtml() {
  const groups = blocks().map(b => {
    const ss = stores().filter(s => s.blockId === b.id);
    if (!ss.length) return '';
    const allOn = ss.every(s => !isHidden(s.id));
    return `<div class="fgroup">
      <button class="fchip blk ${allOn ? 'on' : ''}" data-act="filter-block" data-v="${b.id}">${esc(b.name)}</button>
      ${ss.map(s => `<button class="fchip ${isHidden(s.id) ? '' : 'on'}" data-act="filter-store" data-v="${s.id}">${esc(s.name)}</button>`).join('')}
    </div>`;
  }).join('');
  return `<div class="filters">${groups}<button class="link small" data-act="filter-all">すべて表示</button></div>`;
}
function monthBounds(y, m) { return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(daysIn(y, m))}`]; }

function assignLanes(evs, first, last) {
  const lanes = [];
  return evs.slice().sort((a, b) => a.start.localeCompare(b.start) || diffDays(b.start, evEnd(b)) - diffDays(a.start, evEnd(a)))
    .map(e => {
      const s = e.start < first ? first : e.start;
      const en = evEnd(e) > last ? last : evEnd(e);
      let lane = lanes.findIndex(endDs => endDs < s);
      if (lane < 0) { lane = lanes.length; lanes.push(en); } else lanes[lane] = en;
      return { e, lane, c1: diffDays(first, s) + 1, c2: diffDays(first, en) + 1 };
    });
}
function calStore(y, m) {
  const [first, last] = monthBounds(y, m);
  const n = daysIn(y, m);
  const td = today();
  const days = [];
  for (let i = 0; i < n; i++) { const ds = addDays(first, i); days.push({ ds, d: i + 1, w: dow(ds), cls: dayClass(ds) }); }
  const evs = evList().filter(e => e.start && e.start <= last && evEnd(e) >= first);
  const rows = [
    { label: '大型出展', cls: 'row-big', sid: '__big', events: evs.filter(e => e.type === BIG) },
    { label: '全店共通', cls: 'row-all', sid: 'all', events: evs.filter(e => isAll(e) && e.type !== BIG) }
  ];
  const addStoreRows = (title, ss) => {
    ss = ss.filter(s => !isHidden(s.id));
    if (!ss.length) return;
    rows.push({ block: title });
    ss.forEach(s => rows.push({ label: s.name, sid: s.id, events: evs.filter(e => (e.stores || []).includes(s.id) || (e.type === BIG && isAll(e))) }));
  };
  blocks().forEach(b => addStoreRows(b.name, stores().filter(s => s.blockId === b.id)));
  const bl = blocks().map(b => b.id);
  addStoreRows('(ブロック未設定)', stores().filter(s => !bl.includes(s.blockId)));

  const head = `<div class="sg-row sg-head"><div class="sg-name">店舗</div><div class="sg-days" style="--n:${n}">${days.map(d =>
    `<div class="sg-day ${d.cls} ${d.ds === td ? 'today' : ''}" title="${esc(holidayName(d.ds))}">${d.d}<small>${WD[d.w]}</small></div>`).join('')}</div></div>`;
  const body = rows.map(r => {
    if (r.block) return `<div class="sg-row sg-block"><div class="sg-name">${esc(r.block)}</div><div class="sg-days" style="--n:${n}"></div></div>`;
    const placed = assignLanes(r.events, first, last);
    const lanes = Math.max(1, ...placed.map(p => p.lane + 1));
    const bg = days.map((d, i) => `<div class="sg-bg ${d.cls}" style="grid-column:${i + 1};grid-row:1/-1"></div>`).join('');
    const bars = placed.map(p => `<div class="bar ${typeClass(p.e)}${prepCls(p.e)}" data-act="edit-event" data-id="${p.e.id}"
        style="grid-column:${p.c1}/${p.c2 + 1};grid-row:${p.lane + 1}"
        title="${esc(p.e.name)}\n${esc(dateRange(p.e))} / ${esc(p.e.type)}\n${esc(storeLabel(p.e))}${prepCls(p.e) ? '\n準備完了' : ''}">${prepMark(p.e)}${esc(p.e.name)}</div>`).join('');
    return `<div class="sg-row ${r.cls || ''}"><div class="sg-name">${esc(r.label)}</div>
      <div class="sg-track" data-act="track" data-sid="${r.sid}" data-first="${first}" style="--n:${n};--lanes:${lanes}">${bg}${bars}</div></div>`;
  }).join('');
  return `<div class="sg-wrap" id="sg-scroll"><div class="sg">${head}${body}</div></div>
    ${can('event') ? '<p class="muted small-text">空いているところをクリックすると、その日・その店舗でイベントを登録できます。</p>' : ''}`;
}
function calMonth(y, m) {
  const [first, last] = monthBounds(y, m);
  const start = addDays(first, -dow(first));
  const end = addDays(last, 6 - dow(last));
  const td = today();
  const evs = evList().filter(e => e.start && visibleByFilter(e));
  let cells = '';
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const hol = holidayName(d);
    const chips = evs.filter(e => e.start <= d && evEnd(e) >= d).map(e =>
      `<div class="chip ${typeClass(e)}${prepCls(e)}" data-act="edit-event" data-id="${e.id}" title="${esc(e.name)} / ${esc(storeLabel(e))}">${prepMark(e)}${esc(storeLabel(e))}|${esc(e.name)}</div>`).join('');
    cells += `<div class="mc-cell ${dayClass(d)} ${d < first || d > last ? 'out' : ''} ${d === td ? 'today' : ''}" data-act="day-new" data-date="${d}">
      <div class="mc-date"><b>${Number(d.slice(8))}</b>${hol ? `<span class="mc-hol">${esc(hol)}</span>` : ''}</div>${chips}</div>`;
  }
  return `<div class="mc">${WD.map((w, i) => `<div class="mc-wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}${cells}</div>`;
}
function calList(y, m) {
  const [first, last] = monthBounds(y, m);
  const evs = evList().filter(e => e.start && e.start <= last && evEnd(e) >= first && visibleByFilter(e));
  const money = myRole() !== 'vendor'; // 事業者には金額・実績を見せない
  if (!evs.length) return `<div class="panel empty">この月のイベントはまだありません</div>`;
  return `<div class="table-wrap"><table>
    <tr>${can('prep') ? '<th>準備</th>' : ''}<th>日付</th><th>イベント名</th><th>種類</th><th>店舗</th>${money ? '<th class="num">予算</th><th class="num">使用金額</th><th>成果</th>' : ''}</tr>
    ${evs.map(e => `<tr class="clickable${prepCls(e)}" data-act="edit-event" data-id="${e.id}">
      ${can('prep') ? `<td><input type="checkbox" data-act="prep-toggle" data-id="${e.id}" ${e.prepared ? 'checked' : ''} aria-label="準備完了"></td>` : ''}
      <td class="nowrap">${dateRange(e)}</td><td><span class="typetag ${typeClass(e)}"></span>${esc(e.name)}</td>
      <td class="nowrap">${esc(e.type)}</td><td>${esc(storeLabel(e))}</td>
      ${money ? `<td class="num">${yen(budgetOf(e))}</td><td class="num">${yen(usedOf(e))}</td><td>${resultBadge(e, 'all')}</td>` : ''}</tr>`).join('')}
  </table></div>`;
}
function resultBadge(e, sid) {
  if (perStore(e) && (!sid || sid === 'all')) {
    if (allEntered(e)) return '<span class="badge ok">入力済み</span>';
    const n = resultCount(e);
    if (n) return `<span class="badge warn">${n}/${participants(e).length}店 入力</span>`;
  } else if (hasResult(e, sid)) return '<span class="badge ok">入力済み</span>';
  if (evEnd(e) < today()) return '<span class="badge warn">未入力</span>';
  return '<span class="badge gray">開催前</span>';
}

// ---------------------------------------------------------------- ToDo
const recentDone = new Set();
function todoItems() {
  const out = [];
  evList().forEach(e => {
    if (!e.start) return;
    TODO_DEFS.forEach(d => out.push({ e, d, key: e.id + ':' + d.key, due: d.due(e), done: todoDone(e, d.key) }));
  });
  return out.sort((a, b) => a.due.localeCompare(b.due));
}
function todoHtml() {
  const items = todoItems();
  const open = items.filter(i => !i.done).length;
  if (state.todoClosed) return `<div class="todo closed"><button data-act="todo-toggle">ToDo(${open})を開く</button></div>`;
  const td = today();
  const shown = items.filter(i => !i.done || state.showDone || recentDone.has(i.key));
  const list = shown.map(i => {
    const left = diffDays(td, i.due);
    const cls = i.done ? '' : left < 0 ? 'over' : left <= 3 ? 'soon' : '';
    const dueText = i.done ? md(i.due) : left < 0 ? `${md(i.due)} 期限切れ` : left === 0 ? '今日まで' : `${md(i.due)} あと${left}日`;
    const auto = i.d.key === 'result' && allEntered(i.e);
    return `<div class="todo-item ${i.done ? 'done' : ''}">
      <input type="checkbox" data-act="todo-check" data-id="${i.e.id}" data-k="${i.d.key}" ${i.done ? 'checked' : ''} ${auto ? 'disabled title="成果を入力したので自動で完了しています"' : ''} aria-label="${esc(i.d.label)}を完了にする">
      <div class="grow">
        <div class="t1">${esc(i.d.label)}</div>
        <div class="t2"><a href="#" data-act="${i.d.key === 'result' ? 'result-event' : 'edit-event'}" data-id="${i.e.id}">${esc(i.e.name)}</a> / ${esc(storeLabel(i.e))}</div>
        <span class="due ${cls}">${dueText}</span>
        ${recentDone.has(i.key) && i.done ? `<button class="link small" data-act="todo-undo" data-id="${i.e.id}" data-k="${i.d.key}">元に戻す</button>` : ''}
      </div></div>`;
  }).join('');
  return `<div class="todo">
    <div class="todo-head"><h3>ToDo</h3><span class="badge gray">${open}件</span><div class="grow"></div>
      <button class="link small" data-act="todo-toggle">閉じる</button></div>
    <label class="chk small-text"><input type="checkbox" data-act="todo-showdone" ${state.showDone ? 'checked' : ''}> 完了したタスクも表示</label>
    ${list || '<div class="empty small-text">やることはありません</div>'}
  </div>`;
}

// ---------------------------------------------------------------- 店舗で共有するToDo(店長・社員・事業者)
function storeTodos(sid) {
  return Object.keys(docs).filter(k => k.startsWith('todos/') && docs[k]).map(k => docs[k])
    .filter(t => t.storeId === sid).sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '').localeCompare(b.createdAt || ''));
}
function storeTodoHtml() {
  const sid = session.user.storeId || '';
  const items = storeTodos(sid);
  const open = items.filter(t => !t.done).length;
  if (state.todoClosed) return `<div class="todo closed"><button data-act="todo-toggle">ToDo(${open})を開く</button></div>`;
  const td = today();
  const shown = items.filter(t => !t.done || state.showDone || recentDone.has(t.id));
  const list = shown.map(t => {
    const left = t.date ? diffDays(td, t.date) : null;
    const cls = t.done || left == null ? '' : left < 0 ? 'over' : left <= 3 ? 'soon' : '';
    const dueText = !t.date ? '日付なし' : t.done ? md(t.date) : left < 0 ? `${md(t.date)} 期限切れ` : left === 0 ? '今日まで' : `${md(t.date)} あと${left}日`;
    return `<div class="todo-item ${t.done ? 'done' : ''}">
      <input type="checkbox" data-act="stodo-check" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="完了にする">
      <div class="grow">
        <div class="t1">${esc(t.text)}</div>
        <span class="due ${cls}">${dueText}</span> <span class="t2">${esc(t.by || '')}</span>
        ${recentDone.has(t.id) && t.done ? `<button class="link small" data-act="stodo-undo" data-id="${t.id}">元に戻す</button>` : ''}
      </div>
      <button class="link small danger-text" data-act="stodo-del" data-id="${t.id}" title="削除">×</button></div>`;
  }).join('');
  return `<div class="todo">
    <div class="todo-head"><h3>ToDo</h3><span class="badge gray">${open}件</span>
      <span class="muted small-text">${sid ? esc(storeName(sid)) : ''}</span><div class="grow"></div>
      <button class="link small" data-act="todo-toggle">閉じる</button></div>
    ${sid ? `<div class="stodo-form">
      <input type="date" id="stodo-date" value="${td}" aria-label="日付">
      <input id="stodo-text" placeholder="やること" aria-label="やること">
      <button class="primary small" data-act="stodo-add">追加</button></div>
    <label class="chk small-text"><input type="checkbox" data-act="todo-showdone" ${state.showDone ? 'checked' : ''}> 完了したものも表示</label>
    ${list || '<div class="empty small-text">やることはありません</div>'}
    <p class="muted small-text" style="margin:8px 0 0">同じ店舗の人と共有されます。</p>`
    : '<div class="empty small-text">所属店舗が設定されていません。<br>管理者に店舗を設定してもらってください。</div>'}
  </div>`;
}

// ---------------------------------------------------------------- 期間・店舗の選択
function fyOptions(sel) {
  const base = fyOf(today());
  const out = [];
  for (let f = base - 3; f <= base + 1; f++) out.push(`<option value="${f}" ${f === sel ? 'selected' : ''}>${kiLabel(f)}</option>`);
  return out.join('');
}
function periodHtml() {
  const p = state.period;
  const modes = { month: '月', quarter: '四半期', fy: '期(年度)' };
  let pick = '';
  if (p.mode === 'month') pick = `<input type="month" id="period-ym" data-act="period-ym" value="${p.ym}">`;
  else {
    pick = `<select id="period-fy" data-act="period-fy">${fyOptions(p.fy)}</select>`;
    if (p.mode === 'quarter') pick += `<select id="period-q" data-act="period-q">${[1, 2, 3, 4].map(q => `<option value="${q}" ${q === p.q ? 'selected' : ''}>${Q_LABEL[q]}</option>`).join('')}</select>`;
  }
  return `<div class="seg">${Object.keys(modes).map(k => `<button class="${p.mode === k ? 'on' : ''}" data-act="period-mode" data-v="${k}">${modes[k]}</button>`).join('')}</div>${pick}`;
}
function periodRange() {
  const p = state.period;
  if (p.mode === 'month') { const [y, m] = p.ym.split('-').map(Number); return monthBounds(y, m); }
  if (p.mode === 'quarter') return quarterRange(p.fy, p.q);
  return [`${p.fy}-04-01`, `${p.fy + 1}-03-31`];
}
function storeSelect(id, act, sel, withAll, placeholder, groups) {
  const gs = groups ? PLAN_GROUPS.filter(g => planGroup(g.id)) : [];
  return `<select id="${id}" data-act="${act}">${withAll ? `<option value="all" ${sel === 'all' ? 'selected' : ''}>全店舗</option>` : ''}
    ${gs.length ? `<optgroup label="合算">${gs.map(g => `<option value="${g.id}" ${g.id === sel ? 'selected' : ''}>${esc(g.name)}(合算)</option>`).join('')}</optgroup>` : ''}
    ${placeholder && !sel ? `<option value="" selected>${esc(placeholder)}</option>` : ''}
    ${blocks().map(b => `<optgroup label="${esc(b.name)}">${stores().filter(s => s.blockId === b.id).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}
    ${stores().filter(s => !blocks().some(b => b.id === s.blockId)).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
  </select>`;
}
function eventsIn(range, sid) {
  return evList().filter(e => e.start && e.start >= range[0] && e.start <= range[1] && (sid === 'all' || participants(e).includes(sid)));
}

// ---------------------------------------------------------------- 四半期計画
function viewPlan() {
  const p = state.plan;
  const grp = planGroup(p.storeId);
  if (!grp && !storeById(p.storeId)) p.storeId = (storesOrdered()[0] || {}).id || '';
  const sid = p.storeId;
  if (!sid) return `<div class="panel empty">店舗がありません。「店舗・ブロック設定」から追加してください</div>`;
  const range = quarterRange(p.fy, p.q);
  const key = `plans/${p.fy}-q${p.q}-${sid}`; // 合算ページのメモ・議事録は合算ページ用に持つ
  const plan = getDoc(key) || {};
  const ids = grp ? grp.stores : [sid];
  const storeBudget = id => num((getDoc(`plans/${p.fy}-q${p.q}-${id}`) || {}).budget);
  const evs = evList().filter(e => e.start && e.start >= range[0] && e.start <= range[1] && ids.some(id => participants(e).includes(id)));
  const shareX = e => sum(ids, id => shareOf(e, id));
  const usedX = e => sum(ids, id => usedShare(e, id));
  const budget = grp ? sum(ids, storeBudget) : num(plan.budget);
  const allocated = sum(evs, shareX);
  const used = sum(evs, usedX);
  const rest = budget - allocated;
  const memos = (plan.memos || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const minutes = (plan.minutes || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `
  <div class="view-head">
    ${storeSelect('plan-store', 'plan-store', sid, false, null, true)}
    <select id="plan-fy" data-act="plan-fy">${fyOptions(p.fy)}</select>
    <select id="plan-q" data-act="plan-q">${[1, 2, 3, 4].map(q => `<option value="${q}" ${q === p.q ? 'selected' : ''}>${Q_LABEL[q]}</option>`).join('')}</select>
    <span class="muted small-text">${ymd(range[0])}〜${ymd(range[1])}</span>
  </div>
  <div class="panel budget-hero">
    <div class="bh-main">
      ${grp ? `<div class="bh-title">${esc(grp.name)} ${Q_LABEL[p.q]}の予算(合算)</div>
      <div class="bh-value">${budget ? yen(budget) : '未設定'}</div>
      ${ids.map(id => `<div class="bh-row bh-store"><span>${esc(storeName(id))}</span>${can('plan')
        ? moneyInput(`id="plan-budget-${id}" data-act="plan-budget-store" data-sid="${id}"`, storeBudget(id), '¥ 予算を入力')
        : `<b>${yen(storeBudget(id))}</b>`}</div>`).join('')}
      <div class="muted small-text">店舗ごとの予算を入れると、合算に反映されます(各店舗のページと同じ予算です)</div>`
      : `<div class="bh-title">${esc(storeName(sid))} ${Q_LABEL[p.q]}の予算</div>
      ${can('plan') ? `${moneyInput('id="plan-budget" data-act="plan-budget" class="bh-input"', budget, '¥ 予算を入力')}
      <div class="muted small-text">金額を入れて Enter(または欄の外をクリック)で保存</div>`
      : `<div class="bh-value">${budget ? yen(budget) : '未設定'}</div><div class="muted small-text">四半期予算は店長・管理者が入力します</div>`}`}
    </div>
    <div class="bh-side">
      <div class="bh-row"><span><i class="dot dot-alloc"></i>イベントに配分した予算</span><b>${yen(allocated)}</b></div>
      <div class="bh-row"><span><i class="dot dot-rest"></i>まだ配分していない予算</span><b class="${rest < 0 ? 'red' : ''}">${yen(rest)}</b></div>
      <div class="bh-bar">${budget > 0 ? `<div class="${rest < 0 ? 'over' : ''}" style="width:${Math.min(100, allocated / budget * 100)}%"></div>` : ''}</div>
      <div class="bh-row sub"><span>イベントの使用金額(実績)</span><b class="${used > budget && budget > 0 ? 'red' : ''}">${yen(used)}</b></div>
    </div>
  </div>
  ${cumulativeHtml(cumulative(p.fy, p.q, grp ? ids : sid))}
  <div class="panel">
    <div class="view-head" style="margin-bottom:8px"><h3 style="margin:0">イベント計画</h3><div class="grow"></div>
      <button class="small" data-act="new-event" ${grp ? '' : `data-store="${sid}"`} data-start="${range[0] > today() ? range[0] : (today() <= range[1] ? today() : range[0])}">＋ ${grp ? 'イベントを登録' : 'この店舗のイベントを登録'}</button></div>
    ${evs.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント名</th><th>種類</th>${grp ? '<th>店舗</th>' : ''}<th>区分</th><th class="num">予算${grp ? '(合算分)' : ''}</th><th class="act-cell"></th><th class="num">使用金額${grp ? '(合算分)' : ''}</th></tr>
      ${evs.map(e => `<tr>
        <td class="nowrap">${dateRange(e)}</td>
        <td><a href="#" data-act="edit-event" data-id="${e.id}"><span class="typetag ${typeClass(e)}"></span>${esc(e.name)}</a></td>
        <td class="nowrap">${esc(e.type)}</td>

// ---------------------------------------------------------------- 広告予算管理表(Excel)の出力
// docs/budget_template.xlsx(元の管理表から実データを消した1タブのひな形)の中身のセルだけを書き換える。
// 書式・結合・列幅はひな形のまま。数式には計算結果も入れておくので、保護ビューで開いても数字が見える。
const ZIP_LIB = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
const XL_FIRST = 10, XL_LAST = 81; // ひな形の明細行
function loadScript(src) {
  return new Promise((ok, ng) => {
    const el = document.createElement('script');
    el.src = src; el.onload = ok; el.onerror = () => ng(new Error('Excel出力の部品を読み込めませんでした'));
    document.head.appendChild(el);
  });
}
const xmlEsc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/** シートXMLの1セルを書き換える(スタイル s はひな形のものを使う) */
function xlSet(xml, ref, val, formula, shrink) {
  const re = new RegExp(`<c r="${ref}"([^>]*?)(/>|>[\\s\\S]*?</c>)`);
  const m = xml.match(re);
  if (!m) return xml; // ひな形にないセルは触らない
  let style = (m[1].match(/ s="\d+"/) || [''])[0];
  if (shrink && style) style = ` s="${shrink(Number(style.match(/\d+/)[0]))}"`;
  let body = '', type = '';
  const f = formula ? `<f>${xmlEsc(formula)}</f>` : '';
  if (val === null || val === undefined || val === '') { body = f; }
  else if (typeof val === 'number') { body = f + `<v>${val}</v>`; }
  else if (formula) { type = ' t="str"'; body = f + `<v>${xmlEsc(val)}</v>`; }
  else { type = ' t="inlineStr"'; body = `<is><t>${xmlEsc(val)}</t></is>`; }
  const cell = `<c r="${ref}"${style}${type}>${body}</c>`;
  return xml.replace(re, () => cell); // 関数で渡す($1 などを特別扱いさせない)
}
/** ひな形のセルの書式に「縮小して全体を表示」を付けた書式を足す(狭い列で文字が切れないように) */
function xlShrinkMaker(stylesXml) {
  const doc = new DOMParser().parseFromString(stylesXml, 'application/xml');
  const ns = doc.documentElement.namespaceURI;
  const xfs = doc.getElementsByTagNameNS(ns, 'cellXfs')[0];
  const made = {};
  return {
    shrink(idx) {
      if (made[idx] != null) return made[idx];
      const list = [...xfs.children].filter(e => e.localName === 'xf');
      const src = list[idx]; if (!src) return idx;
      const xf = src.cloneNode(true);
      let al = [...xf.children].find(e => e.localName === 'alignment');
      if (!al) { al = doc.createElementNS(ns, 'alignment'); xf.insertBefore(al, xf.firstChild); }
      al.setAttribute('shrinkToFit', '1'); al.removeAttribute('wrapText');
      xf.setAttribute('applyAlignment', '1');
      xfs.appendChild(xf);
      xfs.setAttribute('count', String(list.length + 1));
      return (made[idx] = list.length);
    },
    xml() { return new XMLSerializer().serializeToString(doc); }
  };
}
async function exportBudgetExcel() {
  const sid = state.uStore; if (!sid) return;
  const fy = state.uFy, q = state.uQ, range = uRange();
  const qn = `第${q}四半期`;
  setBusy(1);
  try {
    if (!window.JSZip) await loadScript(ZIP_LIB);
    const res = await fetch('budget_template.xlsx', { cache: 'no-cache' });
    if (!res.ok) throw new Error('ひな形のファイルが見つかりません');
    const zip = await window.JSZip.loadAsync(await res.arrayBuffer());
    let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');
    const styles = xlShrinkMaker(await zip.file('xl/styles.xml').async('string'));

    const rows = costRows(range, sid);
    if (XL_FIRST + rows.length - 1 >= 204) throw new Error('この四半期の明細が多すぎます(194件まで)');
    // 明細がひな形の72行を超えたら、最後の行をまねて足す
    if (rows.length > XL_LAST - XL_FIRST + 1) {
      const lastRow = xml.match(new RegExp(`<row r="${XL_LAST}"[\\s\\S]*?</row>`))[0];
      let extra = '';
      for (let n = XL_LAST + 1; n <= XL_FIRST + rows.length - 1; n++) {
        extra += lastRow.replace(new RegExp(`r="([A-Z]+)?${XL_LAST}"`, 'g'), (_, col) => `r="${col || ''}${n}"`)
          .replace(/<v>\d+<\/v>/, `<v>${n - XL_FIRST + 1}</v>`)
          .replace(/<f>K\d+-J\d+<\/f>/, `<f>K${n - 1}-J${n}</f>`);
      }
      xml = xml.replace(lastRow, () => lastRow + extra);
      // コード欄(F:G)の結合も足す
      let merges = '';
      for (let n = XL_LAST + 1; n <= XL_FIRST + rows.length - 1; n++) merges += `<mergeCell ref="F${n}:G${n}"/>`;
      xml = xml.replace(/<mergeCells count="(\d+)">/, (_, c) => `<mergeCells count="${Number(c) + rows.length - (XL_LAST - XL_FIRST + 1)}">${merges}`);
    }
    const last = Math.max(XL_LAST, XL_FIRST + rows.length - 1);
    const set = (ref, val, formula, fit) => { xml = xlSet(xml, ref, val, formula, fit ? styles.shrink : null); };
    // 単価:割れないとき(名簿数などが空)は #DIV/0! ではなく空欄にする
    const unit = (ref, a, b, f) => set(ref, b ? a / b : null, `IFERROR(${f},"")`);

    // 見出し・上の集計欄
    set('A1', `${fy - 1990}期　広告予算管理表`);
    set('B3', `${qn}　支給予算額`);
    set('B4', `${qn}　広告宣伝費使用額`);
    set('B5', `${qn}　販売促進費使用額`);
    set('B6', `${qn}　残予算額`);
    const budget = num((getDoc(`plans/${fy}-q${q}-${sid}`) || {}).budget);
    set('E3', budget || null);
    // 部門(広告宣伝費/販促費)はこのツールにないので 0
    set('E4', 0, 'SUMIF($C$9:$C$194,"広告宣伝費",$J$9:$J$194)');
    set('E5', 0, 'SUMIF($C$9:$C$194,"販促費",$J$9:$J$194)');
    set('E6', budget, 'E3-E4-E5');

    const amt = r => Math.round(r.amt);
    const mine = evList().filter(e => e.start && participants(e).includes(sid) && hasResult(e, sid));
    const tot = { h: 0, j: 0, l: 0, n: 0 };
    [0, 1, 2].forEach(i => {
      const d = fromDS(range[0]); d.setUTCMonth(d.getUTCMonth() + i);
      const ym = toDS(d).slice(0, 7), m = d.getUTCMonth() + 1, r = 3 + i;
      const h = sum(rows.filter(x => x.date.slice(0, 7) === ym), amt);
      const evs = mine.filter(e => e.start.startsWith(ym));
      const j = sum(evs.filter(e => category(e) === 'exhibit'), e => num(resultOf(e, sid).leads)); // 取得名簿数
      const l = sum(evs.filter(e => category(e) === 'visit'), e => num(resultOf(e, sid).visits));  // 来場数
      tot.h += h; tot.j += j; tot.l += l;
      set('G' + r, `${m}月使用`);
      set('H' + r, h, `SUMIF($B$${XL_FIRST}:$B$${last},"${m}月",$J$${XL_FIRST}:$J$${last})`);
      set('J' + r, j || null);
      set('L' + r, l || null);
      // 契約数(N)はこのツールにないので空欄
      unit('K' + r, h, j, `H${r}/J${r}`);
      unit('M' + r, h, l, `H${r}/L${r}`);
      unit('O' + r, h, 0, `H${r}/N${r}`);
    });
    set('H6', tot.h, 'SUM(H3:H5)');
    set('J6', tot.j, 'SUM(J3:J5)');
    set('L6', tot.l, 'SUM(L3:L5)');
    set('N6', 0, 'SUM(N3:N5)');
    unit('K6', tot.h, tot.j, 'H6/J6');
    unit('M6', tot.h, tot.l, 'H6/L6');
    unit('O6', tot.h, 0, 'H6/N6');

    // 明細
    let rest = budget;
    set('K9', budget, 'E3');
    for (let n = XL_FIRST; n <= last; n++) {
      const r = rows[n - XL_FIRST];
      if (r) {
        set('B' + n, `${Number(r.date.slice(5, 7))}月`);
        // C 部門・F コード・I 決済 は、このツールにないので空欄
        set('D' + n, costName(r.x.costItemId), null, true);
        set('E' + n, r.e ? [r.e.name, r.x.desc].filter(Boolean).join('　') : (r.x.desc || 'イベント以外の費用'), null, true);
        set('H' + n, r.x.supplier || null, null, true); // 発注先
        set('J' + n, amt(r));
        const note = r.e && !isSingle(r.e) ? (isAll(r.e) ? '全店共通' : '合同') : !r.e ? 'イベント以外' : '';
        set('L' + n, note || null, null, true);
        rest -= amt(r);
      }
      set('K' + n, rest, `K${n - 1}-J${n}`);
    }
    zip.file('xl/worksheets/sheet1.xml', xml, { createFolders: false });

    // タブ名
    let wbx = await zip.file('xl/workbook.xml').async('string');
    wbx = wbx.replace(/(<sheet [^>]*name=")[^"]*"/, (_, head) => `${head}${xmlEsc(qn)}"`).replace(/'[^']*'!/g, () => `'${qn}'!`);
    if (last > XL_LAST) wbx = wbx.replace(/\$A\$1:\$O\$\d+/, () => `$A$1:$O$${last}`);
    zip.file('xl/workbook.xml', wbx, { createFolders: false });
    zip.file('xl/styles.xml', styles.xml(), { createFolders: false });

    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${fy - 1990}期_広告予算管理表_${storeName(sid)}_${qn}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast('Excelを出力しました');
  } catch (e) {
    toast('Excelを出力できませんでした:' + e.message, { err: true });
  } finally {
    setBusy(-1);
  }
}

    <p class="muted small-text">行をクリックすると、直したり削除したりできます。イベントの費用は開催月に入ります。合同・全店共通イベントの費用は、この店舗が入れた分です(イベント全体の金額は各店舗の合計)。</p>`
    : `<div class="empty">この四半期の費用はまだ入力されていません。<br><button class="primary" style="margin-top:10px" data-act="cost-new">＋ 費用を入力</button></div>`;

  const evTable = evs.length ? `<div class="table-wrap"><table>

      ${evs.map(e => {
        const b = shareOf(e, sid), u = usedShare(e, sid);

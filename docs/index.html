    <h3>反響実績がまだ入っていないイベント(${pending.length}件)</h3>
    <div class="table-wrap"><table>
      ${pending.map(e => `<tr><td class="nowrap">${dateRange(e)}</td><td>${evCell(e)}</td><td class="nowrap right">${btn(e)}</td></tr>`).join('')}
    </table></div></div>` : '';

  const table = evs.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント</th><th>状態</th><th>実績</th><th>備考</th><th></th></tr>
      ${evs.map(e => `<tr>
        <td class="nowrap">${dateRange(e)}</td><td>${evCell(e)}</td><td>${resultBadge(e, sid)}</td>
        <td class="small-text">${resultSummary(e, sid)}</td><td class="small-text note-cell">${esc((resultOf(e, sid) || {}).note || '')}</td>
        <td class="nowrap right">${btn(e)}</td></tr>`).join('')}
    </table></div>`
    : '<div class="muted small-text">この四半期にこの店舗のイベントはありません</div>';

  return head + `
  <div class="steps small-text"><b>入力のしかた</b>
    <span>① 終わったイベントの「入力する」を押す</span><span>② 組数・件数を入れて保存</span></div>
  ${pendingHtml}
  <div class="cards">
    <div class="card"><div class="lbl">来場組数(来場型)</div><div class="val">${tv(visits, 'visits')}組</div><div class="muted small-text">うち新規 ${tv(visits, 'newVisits')}組</div></div>
    <div class="card"><div class="lbl">次回アポ(来場型)</div><div class="val">${tv(visits, 'appts')}組</div></div>
    <div class="card"><div class="lbl">名簿獲得(出展)</div><div class="val">${tv(exh, 'leads')}件</div><div class="muted small-text">アポ ${tv(exh, 'appts')}件</div></div>
    <div class="card"><div class="lbl">入力状況</div><div class="val">${done.length} / ${evs.filter(e => e.start <= td).length}件</div><div class="muted small-text">終わったイベントのうち入力済み</div></div>
  </div>
  <div class="panel">
    <h3>${esc(storeName(sid))} のイベントと反響実績</h3>
    ${table}
    <p class="muted small-text">合同・全店共通の来場型イベントは、店舗ごとに自分の店の数を入れます(分析シートで全店舗を選ぶと合計されます)。出展イベントはイベント全体の数をまとめて入れます。</p>
  </div>`;
}
function resultSummary(e, sid) {
  const r = resultOf(e, sid);
  if (!r) return '';
  return category(e) === 'visit'
    ? `来場 <b>${num(r.visits)}</b>組(新規 ${num(r.newVisits)})/ 次回アポ <b>${num(r.appts)}</b>`
    : `名簿 <b>${num(r.leads)}</b>件 / アポ <b>${num(r.appts)}</b>`;
}

// ---------------------------------------------------------------- 予算管理
function viewBudget() {
  const sid = state.bStore;
  const range = periodRange();
  const evs = eventsIn(range, sid);
  const bOf = e => sid === 'all' ? budgetOf(e) : shareOf(e, sid);
  const uOf = e => sid === 'all' ? usedOf(e) : usedShare(e, sid);
  const tb = sum(evs, bOf), tu = sum(evs, uOf);
  const over = evs.filter(e => uOf(e) > bOf(e));
  // 項目ごとの使用金額
  const byItem = {};
  evs.forEach(e => {
    (e.expenses || []).filter(x => expMine(e, x, sid)).forEach(x => {
      const k = x.costItemId || '';
      byItem[k] = byItem[k] || { total: 0, count: 0 };
      byItem[k].total += expShare(e, x, sid); byItem[k].count++;
    });
  });
  const others = othersIn(range, sid);
  const to = sum(others, c => num(c.amount));
  others.forEach(c => {
    const k = c.costItemId || '';
    byItem[k] = byItem[k] || { total: 0, count: 0 };
    byItem[k].total += num(c.amount); byItem[k].count++;
  });
  const itemRows = Object.keys(byItem).sort((a, b) => byItem[b].total - byItem[a].total);
  return `
  <div class="view-head">
    ${periodHtml()}
    ${storeSelect('b-store', 'b-store', sid, true)}
    <div class="grow"></div>
    <button data-act="cost-master">費用項目マスター</button>
  </div>
  ${over.length ? `<div class="banner warn">予算を超えているイベントが ${over.length} 件あります:${over.map(e => esc(e.name)).join('、')}</div>` : ''}
  <div class="cards">
    <div class="card"><div class="lbl">イベント予算の合計</div><div class="val">${yen(tb)}</div></div>
    <div class="card"><div class="lbl">イベントの使用金額</div><div class="val ${tu > tb ? 'neg' : ''}">${yen(tu)}</div></div>
    <div class="card"><div class="lbl">イベント予算の残り</div><div class="val ${tb - tu < 0 ? 'neg' : ''}">${yen(tb - tu)}</div></div>
    <div class="card"><div class="lbl">消化率</div><div class="val">${pct(tu, tb)}</div></div>
    <div class="card"><div class="lbl">イベント以外の費用</div><div class="val">${yen(to)}</div></div>
    <div class="card"><div class="lbl">費用の合計</div><div class="val">${yen(tu + to)}</div></div>
  </div>
  ${cumulativeHtml(cumulative(fyOf(range[1]), qOf(range[1]), sid))}
  <div class="panel">
    <h3>イベントごとの予算と使用金額</h3>
    ${sid !== 'all' ? '<p class="muted small-text" style="margin-top:-4px">合同・全店共通イベントは、この店舗に割り振った予算と、この店舗が入れた使用金額を表示しています(明細は全店舗分)。</p>' : ''}
    ${evs.length ? `<div class="table-wrap"><table>
      <tr><th></th><th>日付</th><th>イベント名</th><th>店舗</th><th class="num">予算</th><th class="num">使用金額</th><th class="num">残り</th></tr>
      ${evs.map(e => {
        const b = bOf(e), u = uOf(e), op = !!state.open[e.id];
        return `<tr class="clickable ${u > b ? 'over' : ''}" data-act="toggle-exp" data-id="${e.id}">
          <td>${op ? '▾' : '▸'}</td><td class="nowrap">${dateRange(e)}</td><td><span class="typetag ${typeClass(e)}"></span>${esc(e.name)}</td>
          <td>${esc(storeLabel(e))}</td><td class="num">${yen(b)}</td><td class="num">${yen(u)}</td>
          <td class="num ${b - u < 0 ? 'red' : ''}">${yen(b - u)}</td></tr>
          ${op ? `<tr><td colspan="7" class="exp-box">${expenseEditor(e)}</td></tr>` : ''}`;
      }).join('')}
    </table></div>` : '<div class="empty">この期間のイベントはありません</div>'}
  </div>
  <div class="panel">
    <div class="view-head" style="margin-bottom:8px"><h3 style="margin:0">イベント以外の費用</h3><div class="grow"></div>
      <button class="small" data-act="cost-new" data-target="other" data-store="${sid === 'all' ? '' : sid}">＋ 追加</button></div>
    ${others.length ? `<div class="table-wrap"><table>
      <tr><th>月</th><th>店舗</th><th>内容</th><th>項目</th><th>発注先</th><th class="num">金額</th><th>入力者</th></tr>
      ${others.map(c => `<tr class="clickable" data-act="cost-edit" data-kind="other" data-x="${c.id}">
        <td class="nowrap">${monthLabel(c.date)}</td><td>${esc(storeName(c.storeId))}</td><td>${esc(c.desc || '')}</td>
        <td>${esc(costName(c.costItemId))}</td><td>${esc(c.supplier || '')}</td><td class="num">${yen(num(c.amount))}</td><td class="small-text muted">${esc(c.updatedBy || c.createdBy || '')}</td></tr>`).join('')}
      <tr class="total"><td colspan="5">合計</td><td class="num">${yen(to)}</td><td></td></tr>
    </table></div>` : '<div class="muted small-text">この期間のイベント以外の費用はありません</div>'}
  </div>
  <div class="panel">
    <h3>項目ごとの使用金額</h3>
    ${itemRows.length ? `<table>
      <tr><th>項目</th><th class="num">件数</th><th class="num">使用金額</th></tr>
      ${itemRows.map(k => `<tr class="clickable" data-act="item-detail" data-v="${esc(k)}"><td>${esc(k ? costName(k) : '(項目なし)')}</td>
        <td class="num">${byItem[k].count}</td><td class="num">${yen(byItem[k].total)}</td></tr>`).join('')}
      <tr class="total"><td>合計</td><td></td><td class="num">${yen(tu + to)}</td></tr>
    </table><p class="muted small-text">イベント以外の費用も含みます。項目をクリックすると「いつ・どのイベントで・何に・いくら」の明細が開きます。</p>` : '<div class="muted small-text">使用金額の明細はまだありません</div>'}
  </div>`;
}
function expenseEditor(e) {
  const xs = e.expenses || [];
  const joint = !isSingle(e), ps = participants(e); // 合同・全店共通は明細ごとに店舗を持つ
  const budgetPart = isSingle(e)
    ? `予算 ${yen(num(e.budget))} <button class="small" data-act="budget-event" data-id="${e.id}">予算を変更</button>`
    : `予算 ${yen(budgetOf(e))} <button class="small" data-act="alloc-event" data-id="${e.id}">予算を割り振る</button>`;
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">${budgetPart}
    <div class="grow"></div><button class="small" data-act="edit-event" data-id="${e.id}">イベントを編集</button></div>
    <table class="exp">
      <tr>${joint ? '<th style="width:130px">店舗</th>' : ''}<th>内容</th><th style="width:170px">項目</th><th style="width:150px">発注先</th><th style="width:130px" class="num">金額</th><th style="width:56px"></th></tr>
      ${xs.map(x => `<tr>
        ${joint ? `<td><select id="ex-${e.id}-${x.id}-store" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="storeId">
          ${x.storeId && ps.includes(x.storeId) ? '' : '<option value="" selected>(按分)</option>'}
          ${ps.map(id => `<option value="${id}" ${id === x.storeId ? 'selected' : ''}>${esc(storeName(id))}</option>`).join('')}</select></td>` : ''}
        <td><input id="ex-${e.id}-${x.id}-desc" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="desc" value="${esc(x.desc || '')}" placeholder="例:A4チラシ 5,000部"></td>
        <td><select id="ex-${e.id}-${x.id}-item" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="costItemId">
          ${costItems().map(c => `<option value="${c.id}" ${c.id === x.costItemId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
          ${x.costItemId && !costItems().some(c => c.id === x.costItemId) ? `<option value="${esc(x.costItemId)}" selected>(削除された項目)</option>` : ''}</select></td>
        <td><input id="ex-${e.id}-${x.id}-supplier" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="supplier" value="${esc(x.supplier || '')}" placeholder="発注先"></td>
        <td>${moneyInput(`id="ex-${e.id}-${x.id}-amount" data-act="exp-field" data-id="${e.id}" data-x="${x.id}" data-f="amount"`, x.amount)}</td>
        <td class="nowrap"><button class="link small danger-text" data-act="exp-del" data-id="${e.id}" data-x="${x.id}">削除</button></td></tr>`).join('')}
    </table>
    <button class="small" style="margin-top:6px" data-act="exp-add" data-id="${e.id}">＋ 明細を追加</button>`;
}

// ---------------------------------------------------------------- 分析シート
function viewEffect() {
  const sid = state.eStore;
  const evs = eventsIn(periodRange(), sid);
  const uOf = e => sid === 'all' ? usedOf(e) : usedShare(e, sid);
  const visits = evs.filter(e => category(e) === 'visit');
  const exh = evs.filter(e => category(e) === 'exhibit');
  const R = e => resultOf(e, sid) || {};
  const hasR = e => hasResult(e, sid);
  const missing = evs.filter(e => !hasR(e) && evEnd(e) < today()).length;
  const tv = (list, f) => sum(list.filter(hasR), e => num(R(e)[f]));
  const vV = tv(visits, 'visits'), vN = tv(visits, 'newVisits'), vA = tv(visits, 'appts'), vU = sum(visits.filter(hasR), uOf);
  const xL = tv(exh, 'leads'), xA = tv(exh, 'appts'), xU = sum(exh.filter(hasR), uOf);
  const cell = (e, v) => hasR(e) ? v : '';
  const rowAttr = e => `class="clickable" data-act="result-event" data-id="${e.id}"${sid !== 'all' ? ` data-store="${sid}"` : ''}`;
  // 種類ごとの合計
  const byType = (types, list) => types.map(t => ({ t, all: list.filter(e => e.type === t) })).filter(x => x.all.length)
    .map(x => Object.assign(x, { done: x.all.filter(hasR) }));
  const vTypes = byType(VISIT_TYPES, visits), xTypes = byType(EXHIBIT_TYPES, exh);
  const typeHtml = (vTypes.length || xTypes.length) ? `<div class="panel">
    <h3>種類ごとの合計</h3>
    ${vTypes.length ? `<div class="table-wrap"><table>
      <tr><th>来場型の種類</th><th class="num">イベント数</th><th class="num">来場組数</th><th class="num">うち新規</th><th class="num">新規率</th><th class="num">次回アポ</th><th class="num">アポ率</th><th class="num">使用金額</th><th class="num">1組あたり</th></tr>
      ${vTypes.map(x => { const v = tv(x.all, 'visits'), nn = tv(x.all, 'newVisits'), a = tv(x.all, 'appts'), u = sum(x.done, uOf); return `<tr>
        <td><span class="typetag ${typeClass(x.all[0])}"></span>${esc(x.t)}</td><td class="num">${x.all.length}件<span class="muted small-text">(入力${x.done.length})</span></td>
        <td class="num">${v}</td><td class="num">${nn}</td><td class="num">${pct(nn, v)}</td><td class="num">${a}</td><td class="num">${pct(a, v)}</td>
        <td class="num">${yen(u)}</td><td class="num">${per(u, v)}</td></tr>`; }).join('')}
      <tr class="total"><td>来場型 合計</td><td class="num">${visits.length}件<span class="muted small-text">(入力${visits.filter(hasR).length})</span></td><td class="num">${vV}</td><td class="num">${vN}</td><td class="num">${pct(vN, vV)}</td><td class="num">${vA}</td><td class="num">${pct(vA, vV)}</td><td class="num">${yen(vU)}</td><td class="num">${per(vU, vV)}</td></tr>
    </table></div>` : ''}
    ${xTypes.length ? `<div class="table-wrap" style="margin-top:12px"><table>
      <tr><th>出展の種類</th><th class="num">イベント数</th><th class="num">名簿獲得数</th><th class="num">アポ数</th><th class="num">アポ率</th><th class="num">使用金額</th><th class="num">名簿1件あたり</th><th class="num">アポ1件あたり</th></tr>
      ${xTypes.map(x => { const l = tv(x.all, 'leads'), a = tv(x.all, 'appts'), u = sum(x.done, uOf); return `<tr>
        <td><span class="typetag ${typeClass(x.all[0])}"></span>${esc(x.t)}</td><td class="num">${x.all.length}件<span class="muted small-text">(入力${x.done.length})</span></td>
        <td class="num">${l}</td><td class="num">${a}</td><td class="num">${pct(a, l)}</td><td class="num">${yen(u)}</td><td class="num">${per(u, l)}</td><td class="num">${per(u, a)}</td></tr>`; }).join('')}
      <tr class="total"><td>出展 合計</td><td class="num">${exh.length}件<span class="muted small-text">(入力${exh.filter(hasR).length})</span></td><td class="num">${xL}</td><td class="num">${xA}</td><td class="num">${pct(xA, xL)}</td><td class="num">${yen(xU)}</td><td class="num">${per(xU, xL)}</td><td class="num">${per(xU, xA)}</td></tr>
    </table></div>` : ''}
    <p class="muted small-text" style="margin:6px 0 0">数と使用金額は、実績が入っているイベントだけで計算しています。</p>
  </div>` : '';
  const notes = e => { // 備考(以前の「良かった点・改善点」が残っていればそれも表示)
    const r = R(e);
    return [r.note ? esc(r.note) : '', r.good ? `<b>良</b> ${esc(r.good)}` : '', r.improve ? `<b>改</b> ${esc(r.improve)}` : ''].filter(Boolean).join('<br>');
  };
  return `
  <div class="view-head">${periodHtml()}${storeSelect('e-store', 'e-store', sid, true)}</div>
  ${missing ? `<div class="banner warn" style="background:var(--warn-weak);color:var(--warn)">終わったのに反響実績が未入力のイベントが ${missing} 件あります</div>` : ''}
  ${typeHtml}
  <div class="panel">
    <h3>来場型イベント</h3>
    ${visits.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント名</th><th>店舗</th><th>状態</th><th class="num">来場組数</th><th class="num">うち新規</th><th class="num">新規率</th><th class="num">次回アポ</th><th class="num">アポ率</th><th class="num">使用金額</th><th class="num">1組あたり</th><th>備考</th></tr>
      ${visits.map(e => { const r = R(e); return `<tr ${rowAttr(e)}>
        <td class="nowrap">${dateRange(e)}</td><td>${esc(e.name)}<br><span class="muted small-text">${esc(e.type)}</span></td><td>${esc(storeLabel(e))}</td><td>${resultBadge(e, sid)}</td>
        <td class="num">${cell(e, num(r.visits))}</td><td class="num">${cell(e, num(r.newVisits))}</td><td class="num">${cell(e, pct(num(r.newVisits), num(r.visits)))}</td>
        <td class="num">${cell(e, num(r.appts))}</td><td class="num">${cell(e, pct(num(r.appts), num(r.visits)))}</td>
        <td class="num">${yen(uOf(e))}</td><td class="num">${cell(e, per(uOf(e), num(r.visits)))}</td><td class="small-text">${notes(e)}</td></tr>`; }).join('')}
      <tr class="total"><td colspan="4">合計(入力済みのみ)</td><td class="num">${vV}</td><td class="num">${vN}</td><td class="num">${pct(vN, vV)}</td><td class="num">${vA}</td><td class="num">${pct(vA, vV)}</td><td class="num">${yen(vU)}</td><td class="num">${per(vU, vV)}</td><td></td></tr>
    </table></div>` : '<div class="empty">この期間の来場型イベントはありません</div>'}
  </div>
  <div class="panel">
    <h3>出展イベント</h3>
    ${exh.length ? `<div class="table-wrap"><table>
      <tr><th>日付</th><th>イベント名</th><th>店舗</th><th>状態</th><th class="num">名簿獲得数</th><th class="num">アポ数</th><th class="num">アポ率</th><th class="num">使用金額</th><th class="num">名簿1件あたり</th><th class="num">アポ1件あたり</th><th>備考</th></tr>
      ${exh.map(e => { const r = R(e); return `<tr ${rowAttr(e)}>
        <td class="nowrap">${dateRange(e)}</td><td>${esc(e.name)}<br><span class="muted small-text">${esc(e.type)}</span></td><td>${esc(storeLabel(e))}</td><td>${resultBadge(e, sid)}</td>
        <td class="num">${cell(e, num(r.leads))}</td><td class="num">${cell(e, num(r.appts))}</td><td class="num">${cell(e, pct(num(r.appts), num(r.leads)))}</td>
        <td class="num">${yen(uOf(e))}</td><td class="num">${cell(e, per(uOf(e), num(r.leads)))}</td><td class="num">${cell(e, per(uOf(e), num(r.appts)))}</td><td class="small-text">${notes(e)}</td></tr>`; }).join('')}
      <tr class="total"><td colspan="4">合計(入力済みのみ)</td><td class="num">${xL}</td><td class="num">${xA}</td><td class="num">${pct(xA, xL)}</td><td class="num">${yen(xU)}</td><td class="num">${per(xU, xL)}</td><td class="num">${per(xU, xA)}</td><td></td></tr>
    </table></div>` : '<div class="empty">この期間の出展イベントはありません</div>'}
  </div>
  <p class="muted small-text">行をクリックすると反響実績を入力できます。${sid !== 'all'
    ? '店舗で絞り込んだときは、使用金額はこの店舗が入れた分、来場型の合同・全店共通イベントはこの店舗が入れた数です(出展イベントはイベント全体の数)。'
    : '合同・全店共通の来場型イベントは、各店舗が入れた数を合計しています。'}</p>`;
}

// ---------------------------------------------------------------- アカウント管理

function accStoreSelect(u) {

  return `<select id="acc-s-${u.id}" data-act="acc-setstore" data-id="${u.id}">

const modalStack = [];
function openModal(m) { modalStack.push(m); renderModal(); }
function closeModal() {
  modalStack.pop(); renderModal();
  if (!modalStack.length && pendingRender) render();
}
function topModal() { return modalStack[modalStack.length - 1]; }
function renderModal() {
  const m = topModal();
  const root = $('modal-root');
  if (!m) { root.innerHTML = ''; return; }
  const html = MODALS[m.kind](m);
  root.innerHTML = `<div class="modal-bg" data-act="modal-bg"><div class="modal ${m.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = root.querySelector('[autofocus]');
  if (f && !m.focused) { f.focus(); m.focused = true; }
}

function allocGrand(m) { return sum(m.draft, a => sum(m.stores, sid => num((a.amounts || {})[sid]))); }
function distribute(total, weights) {
  const W = sum(weights);
  const out = weights.map(w => W > 0 ? Math.floor(total * w / W) : 0);
  let rest = total - sum(out);
  for (let i = 0; rest > 0 && out.length; i = (i + 1) % out.length, rest--) out[i]++;
  return out;
}

function openCostModal(opt) {
  const x = opt.x || null;

  // 新規は今月。費用実績で別の四半期を見ているときは、その四半期の最初の月
  const ur = uRange();
  const month = x && x.date ? x.date.slice(0, 7)

  const draft = {
    target: opt.target || '', eventId: opt.eventId || '', storeId: opt.storeId || '', month,
    lines: [{ costItemId: x ? x.costItemId : '', desc: x ? x.desc || '' : '', supplier: x ? x.supplier || '' : '', amount: x ? num(x.amount) : '' }]
  };
  const orig = x ? { target: opt.target, eventId: opt.eventId || '', id: x.id } : null;
  openModal({ kind: 'expense', wide: true, draft, orig, x, confirmDel: false });
}

const ACT = { click: {}, change: {}, input: {} };
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT.click[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (!actAllowed(el.dataset.act)) return;
  if (el.dataset.act === 'modal-bg' && ev.target !== el) return;
  fn(el, ev);
});
['change', 'input'].forEach(type => document.addEventListener(type, ev => {
  const el = ev.target.closest('[data-act]');
  if (el && ACT[type][el.dataset.act] && actAllowed(el.dataset.act)) ACT[type][el.dataset.act](el, ev);
}));
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && modalStack.length) closeModal();
  if (ev.key === 'Enter' && ev.target.id === 'stodo-text' && !ev.isComposing) ACT.click['stodo-add']();
  if (ev.key === 'Enter' && ev.target.id === 'eb-amount' && !ev.isComposing) ACT.click['eb-save']();
  if (ev.key === 'Enter' && (ev.target.id === 'plan-budget' || ev.target.dataset.act === 'plan-budget-store') && !ev.isComposing) ev.target.blur(); // Enter で確定(保存)
  if (ev.key === 'Enter' && ev.target.id === 'memo-text' && (ev.ctrlKey || ev.metaKey)) ACT.click['memo-add']();
});

  const rect = el.getBoundingClientRect();
  const dw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dw')) || 34;
  const idx = Math.max(0, Math.floor((ev.clientX - rect.left) / dw));
  const start = addDays(el.dataset.first, idx);
  const sid = el.dataset.sid;
  const preset = { start };
  if (sid === '__big') preset.type = BIG;
  else if (sid === 'all') preset.stores = ['all'];
  else preset.stores = [sid];
  openEventModal(null, preset);

  const m = topModal(); readCostForm(m);
  const d = m.draft;
  if (!d.storeId && d.target === 'other') return modalErr('店舗を選んでください');
  if (d.target === 'event' && !getEvent(d.eventId)) return modalErr('どのイベントの費用かを選んでください');
  if (d.target === 'event' && !isSingle(getEvent(d.eventId)) && !participants(getEvent(d.eventId)).includes(d.storeId))
    return modalErr('このイベントに参加している店舗を選んでください(合同イベントの費用は店舗ごとに入れます)');
  if (d.target === 'other' && !/^\d{4}-\d{2}$/.test(d.month || '')) return modalErr('何月分の費用かを入れてください');
  // 何も入れていない行は無視。入れかけの行は金額と項目が必要
  const lines = d.lines.filter(l => num(l.amount) > 0 || l.costItemId || String(l.desc || '').trim() || String(l.supplier || '').trim());
  if (!lines.length) return modalErr('金額を入れてください');
  for (let i = 0; i < lines.length; i++) {
    const no = lines.length > 1 ? `${d.lines.indexOf(lines[i]) + 1}行目:` : '';
    if (!(num(lines[i].amount) > 0)) return modalErr(no + '金額を入れてください');
    if (!lines[i].costItemId) return modalErr(no + '項目を選んでください');
  }
  const by = session.user.name, at = new Date().toISOString();
  const o = m.orig;
  const recs = lines.map((l, i) => ({ id: o && i === 0 ? o.id : uid(), costItemId: l.costItemId, desc: String(l.desc || '').trim(), supplier: String(l.supplier || '').trim(), amount: num(l.amount) }));
  closeModal();
  // 「何の費用か」を変えたときは、元の場所から移す
  if (o && !(o.target === d.target && (d.target === 'other' || o.eventId === d.eventId))) removeCostAt(o);
  const msg = o ? '費用を保存しました' : recs.length > 1 ? `費用を${recs.length}件入力しました` : '費用を入力しました';
  if (d.target === 'event') {
    const e = clone(getEvent(d.eventId));
    const list = e.expenses || [];
    recs.forEach(rec => {
      const i = list.findIndex(r => r.id === rec.id);
      const row = Object.assign({}, i >= 0 ? list[i] : {}, rec, { storeId: d.storeId, by, at });
      delete row.date; // イベントの費用は開催月に入れるので日付は持たない
      if (i >= 0) list[i] = row; else list.push(row);
    });
    e.expenses = list;
    saveDoc('events/' + e.id, e, msg); // 1つのイベントの明細なので、まとめて1回で保存
  } else {
    recs.forEach((rec, i) => {
      const prev = getDoc('costs/' + rec.id) || {};
      saveDoc('costs/' + rec.id, Object.assign({}, prev, rec, { date: d.month + '-01',
        storeId: d.storeId, createdBy: prev.createdBy || by, createdAt: prev.createdAt || at, updatedBy: by, updatedAt: at
      }), i === recs.length - 1 ? msg : null);
    });
  }
};

function toast(msg, opt) {

    <form data-form="login">
      <label><span>メールアドレス</span><input type="email" name="email" autocomplete="email" required></label>
      <label><span>パスワード</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div class="err"></div><button class="primary">ログイン</button>
    </form>
    <p style="text-align:center" class="small-text">はじめての方は <button class="link" data-act="auth-register">新規登録</button></p>
    <p class="muted small-text" style="text-align:center">パスワードを忘れたときは、管理者に仮パスワードの発行を頼んでください。</p></div></div>`;
}
C['auth-login'] = () => showAuth('login');
// 事業者を選んだら、店舗の代わりに会社名を入れる
CH['reg-role'] = el => {
  const vendor = el.value === 'vendor';
  $('reg-store').hidden = vendor;
  $('reg-company').hidden = !vendor;
};
C['auth-register'] = () => showAuth('register');
document.addEventListener('submit', async ev => {
  const form = ev.target.closest('[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(form).entries());
  if (form.dataset.form === 'register') {
    const errEl = form.querySelector('.err');
    if (fd.role === 'vendor') {
      if (!String(fd.company || '').trim()) { errEl.textContent = '会社名を入力してください'; return; }
      fd.storeId = 'co:' + String(fd.company).trim(); // 事業者は会社名で持つ(同じ会社の人とToDoを共有)
    } else if (!fd.storeId) { errEl.textContent = '店舗を選んでください'; return; }
  }
  const err = form.querySelector('.err');
  const btn = form.querySelector('button.primary');
  err.textContent = '';
  if ((form.dataset.form === 'register' || form.dataset.form === 'change')) {
    if (String(fd.password).length < 8) { err.textContent = 'パスワードは8文字以上にしてください'; return; }
    if (fd.password !== fd.password2) { err.textContent = '確認用のパスワードが一致しません'; return; }
  }
  btn.disabled = true;
  const btnText = btn.textContent;
  btn.innerHTML = `<span class="spinner on-btn"></span>${{ login: 'ログインしています…', register: '登録しています…', change: '変更しています…' }[form.dataset.form] || '処理中…'}`;
  try {
    if (form.dataset.form === 'change') {
      const r = await api('changePassword', { current: fd.current, password: fd.password });
      session.user = r.user;
      await startApp();
      toast('パスワードを変更しました');
      return;
    }
    const r = form.dataset.form === 'login'
      ? await api('login', { email: fd.email, password: fd.password })
      : await api('register', { email: fd.email, password: fd.password, name: fd.name, role: fd.role || 'admin', code: fd.code || '', storeId: fd.storeId || '' });
    session.token = r.token; session.user = r.user;
    lsSet('evt-token', r.token);
    if (r.user.mustChange) return showAuth('change');
    if (r.docs) { applyLoaded(r); await startApp('ready'); } // ログインと同時にデータも受け取る
    else await startApp();
    if (form.dataset.form === 'register' && r.user.requestedRole === 'admin') toast('登録しました。管理者の承認待ちです(承認までは店長として使えます)');
  } catch (e) {
    if (e.code !== 'MUST_CHANGE') err.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = btnText;
  }
});
function forceLogout(msg) {
  session.token = null; session.user = null;
  lsSet('evt-token', null);
  docs = {}; version = 0; state.users = null;
  lsSet(CACHE_KEY, null);
  showAuth('login');
  if (msg) toast(msg, { err: true });
}

// ====================================================================== 起動
/** mode: 'cache' = 覚えていた内容ですぐ表示して裏で更新 / 'ready' = 読み込み済み / なし = ここで読み込む */
async function startApp(mode) {
  if (!mode) {
    $('root').innerHTML = `<div class="auth"><div class="panel">${loadingHtml('データを読み込んでいます…')}</div></div>`;
    try {
      await loadAll();
    } catch (e) {
      if (e.code === 'AUTH' || e.code === 'MUST_CHANGE') return;
      $('root').innerHTML = `<div class="auth"><div class="panel"><h1>読み込めませんでした</h1><p class="red">${esc(e.message)}</p><button class="primary" onclick="location.reload()">もう一度読み込む</button></div></div>`;
      return;
    }
  }
  applyPermStyle();
  applyStoreDefaults();
  $('root').innerHTML = shellHtml();
  render();
  if (mode === 'cache') refreshInBackground();
}
(async function boot() {
  if (session.token) {
    const c = cacheLoad();
    if (c && !c.user.mustChange) {
      session.user = c.user; docs = c.docs; version = c.version || 0;
      return startApp('cache');
    }
    $('root').innerHTML = `<div class="auth"><div class="panel">${loadingHtml('データを読み込んでいます…')}</div></div>`;
    try {
      await loadAll(); // ログイン中の人の情報もいっしょに返ってくる
      if (!session.user) session.user = (await api('me')).user;
    } catch (e) {
      if (e.code === 'AUTH' || e.code === 'MUST_CHANGE') return;
      session.token = null; session.user = null; lsSet('evt-token', null);
    }
  }
  if (!session.user) return showAuth('login');
  if (session.user.mustChange) return showAuth('change');
  startApp('ready');
})();
</script>
</body>
</html>

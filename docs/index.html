C['st-block-add'] = () => { stDraft().blocks.push({ id: 'blk_' + uid(), name: '新しいブロック' }); renderModal(); };
C['st-block-del'] = el => { stDraft().blocks.splice(Number(el.dataset.i), 1); renderModal(); };
C['st-add'] = () => { const d = stDraft(); d.stores.push({ id: 'st_' + uid(), name: '新しい店舗', blockId: (d.blocks[0] || {}).id || '', scale: 1 }); renderModal(); };
C['st-del-ask'] = el => { topModal().confirm = Number(el.dataset.i); renderModal(); };
C['st-del-cancel'] = () => { topModal().confirm = null; renderModal(); };
C['st-del'] = el => { const m = topModal(); m.draft.stores.splice(Number(el.dataset.i), 1); m.confirm = null; renderModal(); };
C['st-save'] = () => {
  const d = stDraft();
  if (d.blocks.some(b => !b.name.trim()) || d.stores.some(s => !s.name.trim())) return modalErr('名前が空の行があります');
  d.blocks.forEach(b => { b.name = b.name.trim(); });
  d.stores.forEach(s => { s.name = s.name.trim(); s.scale = num(s.scale) || 1; });
  closeModal();
  saveDoc('config/stores', d, '店舗・ブロック設定を保存しました');
};

// 費用項目モーダル
IN['ci-name'] = el => { topModal().draft[Number(el.dataset.i)].name = el.value; };
C['ci-add'] = () => { topModal().draft.push({ id: 'ci_' + uid(), name: '' }); renderModal(); };
C['ci-del-ask'] = el => { topModal().confirm = Number(el.dataset.i); renderModal(); };
C['ci-del-cancel'] = () => { topModal().confirm = null; renderModal(); };
C['ci-del'] = el => { const m = topModal(); m.draft.splice(Number(el.dataset.i), 1); m.confirm = null; renderModal(); };
C['ci-save'] = () => {
  const items = topModal().draft.map(c => ({ id: c.id, name: c.name.trim() })).filter(c => c.name);
  if (!items.length) return modalErr('項目を1つ以上入れてください');
  closeModal();
  saveDoc('config/costItems', { items }, '費用項目を保存しました');
};

// パスワード変更
C['pw-save'] = async () => {
  const cur = $('pw-cur').value, p1 = $('pw-new').value, p2 = $('pw-new2').value;
  if (p1.length < 8) return modalErr('新しいパスワードは8文字以上にしてください');
  if (p1 !== p2) return modalErr('確認用のパスワードが一致しません');
  try { await api('changePassword', { current: cur, password: p1 }); closeModal(); toast('パスワードを変更しました'); }
  catch (e) { modalErr(e.message); }
};

// ====================================================================== 通知
function toast(msg, opt) {
  opt = opt || {};
  const el = document.createElement('div');
  el.className = 'toast' + (opt.err ? ' err' : '');
  el.textContent = msg;
  $('toast-root').appendChild(el);
  setTimeout(() => el.remove(), opt.err ? 6000 : 2600);
}

// ====================================================================== ログイン画面
let authMode = 'login', hasUsers = true, needsCode = false;
async function showAuth(mode) {
  authMode = mode;
  modalStack.length = 0; renderModal();
  if (mode === 'register') { try { const s = await api('status'); hasUsers = s.hasUsers; needsCode = !!s.needsCode; } catch (e) { } }
  $('root').innerHTML = authHtml();
  const f = $('root').querySelector('input'); if (f) f.focus();
}
function authHtml() {
  const demo = DEMO ? '<div class="note" style="background:var(--warn-weak);color:var(--warn)">お試しモードです。登録した内容はこのブラウザの中だけに保存されます。</div>' : '';
  if (authMode === 'change') return `<div class="auth"><div class="panel">
    <h1>パスワードの変更</h1><p class="muted">仮パスワードでログインしました。新しいパスワードを決めてください。</p>
    <form data-form="change">
      <label><span>仮パスワード</span><input type="password" name="current" autocomplete="current-password" required></label>
      <label><span>新しいパスワード(8文字以上)</span><input type="password" name="password" autocomplete="new-password" required></label>
      <label><span>新しいパスワード(確認)</span><input type="password" name="password2" autocomplete="new-password" required></label>
      <div class="err"></div><button class="primary">変更して始める</button>
    </form>
    <p style="text-align:center"><button class="link small" data-act="logout">ログアウト</button></p></div></div>`;
  if (authMode === 'register') return `<div class="auth"><div class="panel">
    <h1>新規登録</h1><p class="muted">店舗イベント管理を使うためのアカウントを作ります。</p>${demo}
    ${hasUsers ? '' : '<div class="note">まだ誰も登録していません。最初に登録した人が管理者になります。</div>'}
    <form data-form="register">
      <label><span>権限</span><select name="role" ${hasUsers ? '' : 'disabled'}>
        <option value="staff">スタッフ</option><option value="manager">店長</option><option value="admin" ${hasUsers ? '' : 'selected'}>管理者</option></select></label>
      ${hasUsers ? '<div class="note">管理者を選んだ場合は、今いる管理者が承認すると管理者になります。承認されるまでは店長として使えます。</div>' : ''}
      
      ${needsCode ? '<label><span>登録用コード(管理者から聞いてください)</span><input name="code" autocomplete="off" required></label>' : ''}
      <label><span>名前</span><input name="name" autocomplete="name" required></label>
      <label><span>メールアドレス</span><input type="email" name="email" autocomplete="email" required></label>
      <label><span>パスワード(8文字以上)</span><input type="password" name="password" autocomplete="new-password" required></label>
      <label><span>パスワード(確認)</span><input type="password" name="password2" autocomplete="new-password" required></label>
      <div class="err"></div><button class="primary">登録して始める</button>
    </form>
    <p style="text-align:center" class="small-text">登録済みの方は <button class="link" data-act="auth-login">ログイン</button></p></div></div>`;
  return `<div class="auth"><div class="panel">
    <h1>店舗イベント管理</h1><p class="muted">メールアドレスとパスワードでログインしてください。</p>${demo}
    <form data-form="login">
      <label><span>メールアドレス</span><input type="email" name="email" autocomplete="email" required></label>
      <label><span>パスワード</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div class="err"></div><button class="primary">ログイン</button>
    </form>
    <p style="text-align:center" class="small-text">はじめての方は <button class="link" data-act="auth-register">新規登録</button></p>
    <p class="muted small-text" style="text-align:center">パスワードを忘れたときは、管理者に仮パスワードの発行を頼んでください。</p></div></div>`;
}
C['auth-login'] = () => showAuth('login');
C['auth-register'] = () => showAuth('register');
document.addEventListener('submit', async ev => {
  const form = ev.target.closest('[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(form).entries());
  const err = form.querySelector('.err');
  const btn = form.querySelector('button.primary');
  err.textContent = '';
  if ((form.dataset.form === 'register' || form.dataset.form === 'change')) {
    if (String(fd.password).length < 8) { err.textContent = 'パスワードは8文字以上にしてください'; return; }
    if (fd.password !== fd.password2) { err.textContent = '確認用のパスワードが一致しません'; return; }
  }
  btn.disabled = true;
  try {
    if (form.dataset.form === 'change') {
      const r = await api('changePassword', { current: fd.current, password: fd.password });
      session.user = r.user;
      await startApp();
      toast('パスワードを変更しました');
      return;
    }
    const r = form.dataset.form === 'login'
      ? await api('login', { email: fd.email, password: fd.password })
      : await api('register', { email: fd.email, password: fd.password, name: fd.name, role: fd.role || 'admin', code: fd.code || '' });
    session.token = r.token; session.user = r.user;
    lsSet('evt-token', r.token);
    if (r.user.mustChange) return showAuth('change');
    if (r.docs) { applyLoaded(r); await startApp('ready'); } // ログインと同時にデータも受け取る
    else await startApp();
    if (form.dataset.form === 'register' && r.user.requestedRole === 'admin') toast('登録しました。管理者の承認待ちです(承認までは店長として使えます)');
  } catch (e) {
    if (e.code !== 'MUST_CHANGE') err.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});
function forceLogout(msg) {
  session.token = null; session.user = null;
  lsSet('evt-token', null);
  docs = {}; version = 0; state.users = null;
  lsSet(CACHE_KEY, null);
  showAuth('login');
  if (msg) toast(msg, { err: true });
}

// ====================================================================== 起動
/** mode: 'cache' = 覚えていた内容ですぐ表示して裏で更新 / 'ready' = 読み込み済み / なし = ここで読み込む */
async function startApp(mode) {
  if (!mode) {
    $('root').innerHTML = '<div class="auth"><div class="panel empty">読み込み中…</div></div>';
    try {
      await loadAll();
    } catch (e) {
      if (e.code === 'AUTH' || e.code === 'MUST_CHANGE') return;
      $('root').innerHTML = `<div class="auth"><div class="panel"><h1>読み込めませんでした</h1><p class="red">${esc(e.message)}</p><button class="primary" onclick="location.reload()">もう一度読み込む</button></div></div>`;
      return;
    }
  }
  $('root').innerHTML = shellHtml();
  render();
  if (mode === 'cache') refreshInBackground();
}
(async function boot() {
  if (session.token) {
    const c = cacheLoad();
    if (c && !c.user.mustChange) {
      session.user = c.user; docs = c.docs; version = c.version || 0;
      return startApp('cache');
    }
    $('root').innerHTML = '<div class="auth"><div class="panel empty">読み込み中…</div></div>';
    try {
      await loadAll(); // ログイン中の人の情報もいっしょに返ってくる
      if (!session.user) session.user = (await api('me')).user;
    } catch (e) {
      if (e.code === 'AUTH' || e.code === 'MUST_CHANGE') return;
      session.token = null; session.user = null; lsSet('evt-token', null);
    }
  }
  if (!session.user) return showAuth('login');
  if (session.user.mustChange) return showAuth('change');
  startApp('ready');
})();
</script>
